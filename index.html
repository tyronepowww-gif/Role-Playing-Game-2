<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no"
  />
  <meta name="theme-color" content="#05070b" />
  <title>Laser Dodge</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #05070b;
      font-family: Arial, Helvetica, sans-serif;
    }

    #app,
    #video,
    #canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #app {
      overflow: hidden;
      background: #05070b;
    }

    #video {
      z-index: 1;
      object-fit: cover;
      transform: scaleX(-1);
      opacity: 0.36;
      background: #000;
    }

    #canvas {
      z-index: 2;
      pointer-events: none;
    }

    #hud {
      position: fixed;
      z-index: 5;
      top: 12px;
      left: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      max-width: calc(100vw - 24px);
      color: #ffffff;
      font-size: 14px;
    }

    .hud-item {
      padding: 9px 11px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 9px;
      background: rgba(0, 0, 0, 0.70);
      line-height: 1.2;
    }

    #status {
      color: #dbe7ff;
    }

    #permission-panel {
      position: fixed;
      z-index: 10;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(
          circle at center,
          rgba(52, 16, 36, 0.48),
          rgba(0, 0, 0, 0.90) 68%
        );
    }

    #permission-card {
      width: min(440px, 100%);
      padding: 24px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 16px;
      background: rgba(11, 12, 18, 0.96);
      color: #ffffff;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.55);
    }

    #permission-card h1 {
      margin: 0 0 12px;
      font-size: 26px;
    }

    #permission-card p {
      margin: 0 0 18px;
      color: #d3d8e5;
      font-size: 15px;
      line-height: 1.55;
    }

    #camera-permission {
      min-width: 190px;
      padding: 13px 18px;
      border: 0;
      border-radius: 10px;
      background: #73f5ff;
      color: #001018;
      cursor: pointer;
      font-size: 16px;
      font-weight: 700;
    }

    #camera-permission:hover {
      background: #a3f9ff;
    }

    #camera-permission:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>
  <main id="app">
    <video id="video" autoplay muted playsinline></video>
    <canvas id="canvas"></canvas>

    <div id="hud">
      <div class="hud-item" id="score-display">Score: 0</div>
      <div class="hud-item" id="health-display">Health: 3</div>
      <div class="hud-item" id="status">
        Camera permission required
      </div>
    </div>

    <section id="permission-panel" aria-live="polite">
      <div id="permission-card">
        <h1>Laser Dodge</h1>

        <p id="permission-message">
          Allow camera access. The game begins after one centered face and a
          foreground body silhouette are confirmed.
        </p>

        <button id="camera-permission" type="button">
          Allow Camera
        </button>
      </div>
    </section>
  </main>

  <!-- TensorFlow.js runtime -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core@4.22.0/dist/tf-core.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl@4.22.0/dist/tf-backend-webgl.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter@4.22.0/dist/tf-converter.min.js"></script>

  <!-- TensorFlow.js face detector -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/face-detection@1.0.3/dist/face-detection.min.js"></script>

  <!-- TensorFlow.js person/body segmentation -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/body-segmentation@1.0.2/dist/body-segmentation.min.js"></script>

  <script>
    (() => {
      const video = document.getElementById("video");
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");

      const scoreDisplay = document.getElementById("score-display");
      const healthDisplay = document.getElementById("health-display");
      const statusDisplay = document.getElementById("status");

      const permissionPanel =
        document.getElementById("permission-panel");

      const permissionMessage =
        document.getElementById("permission-message");

      const permissionButton =
        document.getElementById("camera-permission");

      /*
        Holds a low-resolution green player silhouette.
        It is used for both drawing and laser collision.
      */
      const maskCanvas = document.createElement("canvas");
      const maskCtx = maskCanvas.getContext(
        "2d",
        { willReadFrequently: true }
      );

      let mediaStream = null;

      let faceDetector = null;
      let faceDetectorLoading = false;
      let segmenter = null;
      let segmenterLoading = false;

      let faceDetectionBusy = false;
      let segmentationBusy = false;

      let lastFaceDetectionAt = 0;
      let lastSegmentationAt = 0;

      let running = false;
      let gameStarted = false;
      let gameOver = false;

      let score = 0;
      let health = 3;

      let laser = null;
      let lastLaserEndedAt = 0;

      /*
        Performance controls. Face checks run slightly faster than
        silhouette checks because the face gate controls readiness.
      */
      const faceCheckIntervalMs = 70;
      const segmentationIntervalMs = 95;

      /*
        Face gating requirements.
        In video-normalized coordinates:
        - Center X must remain between 24% and 76%.
        - Center Y must remain between 15% and 72%.
        - Face width must be at least 9% of camera-frame width.
        - Exactly one detected face is permitted.
      */
      const faceCenterMinX = 0.24;
      const faceCenterMaxX = 0.76;
      const faceCenterMinY = 0.15;
      const faceCenterMaxY = 0.72;
      const minFaceWidthRatio = 0.09;
      const requiredStableFaceFrames = 12;

      /*
        Body segmentation requirements.
      */
      const personAlphaThreshold = 145;
      const minBodyAreaRatio = 0.018;
      const requiredStableBodyFrames = 6;
      const trackingGraceMs = 800;

      let stableFaceFrames = 0;
      let stableBodyFrames = 0;

      const faceState = {
        valid: false,
        centerX: 0.5,
        centerY: 0.5,
        widthRatio: 0,
        lastSeenAt: 0
      };

      const player = {
        tracked: false,
        lastTrackedAt: 0,

        /*
          One byte for every mask pixel:
          255 = person
          0 = background
        */
        pixels: null,

        width: 0,
        height: 0,

        minX: 0,
        minY: 0,
        maxX: 0,
        maxY: 0,

        activePixelCount: 0
      };

      function resizeCanvas() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);

        canvas.width = Math.floor(window.innerWidth * dpr);
        canvas.height = Math.floor(window.innerHeight * dpr);

        canvas.style.width = `${window.innerWidth}px`;
        canvas.style.height = `${window.innerHeight}px`;

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function clearPlayerMask() {
        player.tracked = false;
        player.pixels = null;
        player.width = 0;
        player.height = 0;
        player.minX = 0;
        player.minY = 0;
        player.maxX = 0;
        player.maxY = 0;
        player.activePixelCount = 0;

        maskCanvas.width = 1;
        maskCanvas.height = 1;
      }

      function resetFaceState() {
        faceState.valid = false;
        faceState.centerX = 0.5;
        faceState.centerY = 0.5;
        faceState.widthRatio = 0;
        faceState.lastSeenAt = 0;

        stableFaceFrames = 0;
      }

      function resetGame() {
        score = 0;
        health = 3;

        laser = null;
        lastLaserEndedAt = performance.now();

        lastFaceDetectionAt = 0;
        lastSegmentationAt = 0;

        stableFaceFrames = 0;
        stableBodyFrames = 0;

        gameStarted = false;
        gameOver = false;

        resetFaceState();

        player.lastTrackedAt = 0;
        clearPlayerMask();

        updateHud();
      }

      function updateHud() {
        scoreDisplay.textContent = `Score: ${score}`;
        healthDisplay.textContent = `Health: ${health}`;

        if (gameOver) {
          statusDisplay.textContent =
            "Game over — refresh the page to play again.";
          return;
        }

        if (!faceDetector || !segmenter) {
          statusDisplay.textContent =
            "Loading TensorFlow tracking…";
          return;
        }

        if (stableFaceFrames < requiredStableFaceFrames) {
          statusDisplay.textContent =
            `Center your face — ${stableFaceFrames}/${requiredStableFaceFrames}`;
          return;
        }

        if (
          stableBodyFrames <
          requiredStableBodyFrames
        ) {
          statusDisplay.textContent =
            `Confirming body silhouette — ${stableBodyFrames}/${requiredStableBodyFrames}`;
          return;
        }

        if (!gameStarted) {
          statusDisplay.textContent =
            "Tracking confirmed — preparing lasers.";
          return;
        }

        if (!player.tracked) {
          statusDisplay.textContent =
            "Person lost — lasers inactive.";
          return;
        }

        statusDisplay.textContent =
          "Person tracked — dodge the red laser.";
      }

      function showCameraError(error) {
        console.error("Camera error:", error);

        permissionButton.disabled = false;
        permissionButton.textContent = "Try Camera Again";

        let message = "";

        if (!window.isSecureContext) {
          message =
            "Camera access requires HTTPS. Open the GitHub Pages URL, not a local file or HTTP address.";
        } else if (!navigator.mediaDevices?.getUserMedia) {
          message =
            "This browser does not support camera access.";
        } else if (error?.name === "NotAllowedError") {
          message =
            "Camera permission was blocked. Use the camera or lock icon in the browser address bar, allow camera access for this site, then try again.";
        } else if (error?.name === "NotFoundError") {
          message =
            "No usable camera was found on this device.";
        } else if (error?.name === "NotReadableError") {
          message =
            "The camera is busy in another app or browser tab.";
        } else {
          message =
            `Camera could not start: ${
              error?.message || error?.name || "Unknown error"
            }`;
        }

        permissionMessage.textContent = message;
        statusDisplay.textContent = "Camera access was not granted.";
      }

      async function enableCamera(event) {
        event.preventDefault();

        if (mediaStream) {
          permissionPanel.classList.add("hidden");
          return;
        }

        if (!window.isSecureContext) {
          showCameraError(
            new Error("This page is not running in a secure context.")
          );
          return;
        }

        if (!navigator.mediaDevices?.getUserMedia) {
          showCameraError(
            new Error("navigator.mediaDevices.getUserMedia is unavailable.")
          );
          return;
        }

        try {
          permissionButton.disabled = true;
          permissionButton.textContent = "Requesting Access…";

          permissionMessage.textContent =
            "Your browser should now display its camera permission dialog.";

          /*
            Keep getUserMedia directly inside the click event.
          */
          mediaStream = await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: false
          });

          video.srcObject = mediaStream;

          await video.play();

          resetGame();

          permissionPanel.classList.add("hidden");

          statusDisplay.textContent =
            "Camera active. Loading face and body tracking…";

          running = true;
          requestAnimationFrame(loop);

          loadTensorFlowModels();

        } catch (error) {
          showCameraError(error);
        }
      }

      async function loadTensorFlowModels() {
        if (
          (faceDetector && segmenter) ||
          faceDetectorLoading ||
          segmenterLoading
        ) {
          return;
        }

        faceDetectorLoading = true;
        segmenterLoading = true;

        try {
          if (
            !window.tf ||
            !window.faceDetection ||
            !window.bodySegmentation
          ) {
            throw new Error(
              "TensorFlow.js libraries did not load. Check your internet connection and reload."
            );
          }

          await tf.setBackend("webgl");
          await tf.ready();

          const faceModel =
            faceDetection.SupportedModels
              .MediaPipeFaceDetector;

          faceDetector =
            await faceDetection.createDetector(
              faceModel,
              {
                runtime: "tfjs",
                maxFaces: 2,
                modelType: "short"
              }
            );

          const bodyModel =
            bodySegmentation.SupportedModels
              .MediaPipeSelfieSegmentation;

          segmenter =
            await bodySegmentation.createSegmenter(
              bodyModel,
              {
                runtime: "tfjs",
                modelType: "general"
              }
            );

          updateHud();

        } catch (error) {
          console.error("TensorFlow model error:", error);

          statusDisplay.textContent =
            "Camera active, but TensorFlow tracking could not load.";

        } finally {
          faceDetectorLoading = false;
          segmenterLoading = false;
        }
      }

      function getFaceBox(face) {
        /*
          The current face-detection API uses a box property
          shaped like { xMin, yMin, width, height }.
        */
        if (face?.box) {
          return face.box;
        }

        /*
          Defensive fallback for API variants.
        */
        if (face?.boundingBox) {
          return face.boundingBox;
        }

        return null;
      }

      async function updateFaceTracking(timestamp) {
        if (
          !faceDetector ||
          faceDetectionBusy ||
          video.readyState <
            HTMLMediaElement.HAVE_CURRENT_DATA
        ) {
          return;
        }

        if (
          timestamp - lastFaceDetectionAt <
          faceCheckIntervalMs
        ) {
          return;
        }

        faceDetectionBusy = true;
        lastFaceDetectionAt = timestamp;

        try {
          const faces =
            await faceDetector.estimateFaces(
              video,
              {
                flipHorizontal: false
              }
            );

          /*
            Require exactly one face. If there are zero faces or
            multiple faces, the Center-Stage-style start gate resets.
          */
          if (faces.length !== 1) {
            faceState.valid = false;
            stableFaceFrames = 0;
            return;
          }

          const box = getFaceBox(faces[0]);

          if (
            !box ||
            !video.videoWidth ||
            !video.videoHeight
          ) {
            faceState.valid = false;
            stableFaceFrames = 0;
            return;
          }

          const centerX =
            (box.xMin + box.width / 2) /
            video.videoWidth;

          const centerY =
            (box.yMin + box.height / 2) /
            video.videoHeight;

          const widthRatio =
            box.width / video.videoWidth;

          const centered =
            centerX >= faceCenterMinX &&
            centerX <= faceCenterMaxX &&
            centerY >= faceCenterMinY &&
            centerY <= faceCenterMaxY;

          const largeEnough =
            widthRatio >= minFaceWidthRatio;

          const validFace =
            centered && largeEnough;

          faceState.valid = validFace;
          faceState.centerX = centerX;
          faceState.centerY = centerY;
          faceState.widthRatio = widthRatio;

          if (validFace) {
            faceState.lastSeenAt = timestamp;

            stableFaceFrames += 1;
          } else {
            stableFaceFrames = 0;
          }

        } catch (error) {
          console.warn("Face detection frame failed:", error);

        } finally {
          faceDetectionBusy = false;
        }
      }

      /*
        Converts the segmentation output into a mirrored binary player
        mask. It returns true only when enough of the frame is clearly
        categorized as foreground person.
      */
      function updatePlayerMask(maskImageData) {
        const sourceWidth = maskImageData.width;
        const sourceHeight = maskImageData.height;

        if (!sourceWidth || !sourceHeight) {
          clearPlayerMask();
          return false;
        }

        const sourcePixels = maskImageData.data;

        const binary = new Uint8Array(
          sourceWidth * sourceHeight
        );

        const greenRgba = new Uint8ClampedArray(
          sourceWidth * sourceHeight * 4
        );

        let minX = sourceWidth;
        let minY = sourceHeight;
        let maxX = -1;
        let maxY = -1;
        let activePixelCount = 0;

        for (let y = 0; y < sourceHeight; y += 1) {
          for (let x = 0; x < sourceWidth; x += 1) {
            const sourceIndex =
              y * sourceWidth + x;

            const sourceRgbaIndex =
              sourceIndex * 4;

            const alpha =
              sourcePixels[sourceRgbaIndex + 3];

            if (alpha < personAlphaThreshold) {
              continue;
            }

            /*
              The video display is mirrored with CSS, so mirror the
              mask horizontally before it is used or drawn.
            */
            const mirroredX =
              sourceWidth - 1 - x;

            const targetIndex =
              y * sourceWidth + mirroredX;

            const targetRgbaIndex =
              targetIndex * 4;

            binary[targetIndex] = 255;

            greenRgba[targetRgbaIndex] = 72;
            greenRgba[targetRgbaIndex + 1] = 255;
            greenRgba[targetRgbaIndex + 2] = 180;
            greenRgba[targetRgbaIndex + 3] = 128;

            activePixelCount += 1;

            if (mirroredX < minX) minX = mirroredX;
            if (mirroredX > maxX) maxX = mirroredX;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }

        const bodyAreaRatio =
          activePixelCount /
          (sourceWidth * sourceHeight);

        if (
          activePixelCount === 0 ||
          bodyAreaRatio < minBodyAreaRatio
        ) {
          clearPlayerMask();
          return false;
        }

        maskCanvas.width = sourceWidth;
        maskCanvas.height = sourceHeight;

        maskCtx.putImageData(
          new ImageData(
            greenRgba,
            sourceWidth,
            sourceHeight
          ),
          0,
          0
        );

        player.pixels = binary;
        player.width = sourceWidth;
        player.height = sourceHeight;
        player.minX = minX;
        player.minY = minY;
        player.maxX = maxX;
        player.maxY = maxY;
        player.activePixelCount = activePixelCount;
        player.tracked = true;

        return true;
      }

      async function updateBodySegmentation(timestamp) {
        if (
          !segmenter ||
          segmentationBusy ||
          video.readyState <
            HTMLMediaElement.HAVE_CURRENT_DATA
        ) {
          return;
        }

        if (
          timestamp - lastSegmentationAt <
          segmentationIntervalMs
        ) {
          return;
        }

        segmentationBusy = true;
        lastSegmentationAt = timestamp;

        try {
          /*
            A valid centered face is required before we spend work
            on body confirmation. It also prevents the body mask
            alone from starting the game.
          */
          if (
            stableFaceFrames <
            requiredStableFaceFrames
          ) {
            stableBodyFrames = 0;

            if (
              timestamp - player.lastTrackedAt >
              trackingGraceMs
            ) {
              clearPlayerMask();
            }

            return;
          }

          const people =
            await segmenter.segmentPeople(
              video,
              {
                flipHorizontal: false,
                multiSegmentation: false,
                segmentBodyParts: false
              }
            );

          const person = people?.[0];

          if (!person?.mask) {
            stableBodyFrames = 0;

            if (
              timestamp - player.lastTrackedAt >
              trackingGraceMs
            ) {
              clearPlayerMask();
            }

            return;
          }

          const maskImageData =
            await person.mask.toImageData();

          const validBody =
            updatePlayerMask(maskImageData);

          if (!validBody) {
            stableBodyFrames = 0;

            if (
              timestamp - player.lastTrackedAt >
              trackingGraceMs
            ) {
              clearPlayerMask();
            }

            return;
          }

          player.lastTrackedAt = timestamp;

          stableBodyFrames += 1;

          if (
            !gameStarted &&
            stableBodyFrames >=
              requiredStableBodyFrames
          ) {
            gameStarted = true;
            lastLaserEndedAt = timestamp;
          }

        } catch (error) {
          console.warn(
            "Body segmentation frame failed:",
            error
          );

        } finally {
          segmentationBusy = false;
        }
      }

      function chooseLaserOrientation() {
        return Math.random() > 0.5
          ? "horizontal"
          : "vertical";
      }

      function spawnLaser(timestamp) {
        if (!gameStarted || !player.tracked) {
          return;
        }

        const orientation =
          chooseLaserOrientation();

        const linePosition =
          orientation === "horizontal"
            ? 70 +
              Math.random() *
              Math.max(
                80,
                window.innerHeight - 140
              )
            : 70 +
              Math.random() *
              Math.max(
                80,
                window.innerWidth - 140
              );

        laser = {
          orientation,
          linePosition,
          createdAt: timestamp,
          warningTime: 850,
          activeTime: 950,
          thickness: 20,
          active: false,
          damageApplied: false
        };
      }

      function updateLaser(timestamp) {
        /*
          Existing or future lasers are harmless until both systems
          agree that a tracked foreground person remains present.
        */
        if (
          !gameStarted ||
          !player.tracked
        ) {
          return;
        }

        if (!laser) {
          if (timestamp - lastLaserEndedAt > 1100) {
            spawnLaser(timestamp);
          }

          return;
        }

        const elapsed =
          timestamp - laser.createdAt;

        if (
          !laser.active &&
          elapsed >= laser.warningTime
        ) {
          laser.active = true;
        }

        if (
          laser.active &&
          !laser.damageApplied &&
          laserHitsPlayer(laser)
        ) {
          laser.damageApplied = true;
          health -= 1;

          if (health <= 0) {
            running = false;
            gameOver = true;
            updateHud();
            return;
          }
        }

        if (
          elapsed >=
          laser.warningTime + laser.activeTime
        ) {
          if (!laser.damageApplied) {
            score += 1;
          }

          laser = null;
          lastLaserEndedAt = timestamp;
        }
      }

      function bodyMaskContainsScreenPoint(
        screenX,
        screenY
      ) {
        if (
          !player.tracked ||
          !player.pixels ||
          player.width <= 0 ||
          player.height <= 0
        ) {
          return false;
        }

        const maskX = Math.floor(
          (screenX / window.innerWidth) *
          player.width
        );

        const maskY = Math.floor(
          (screenY / window.innerHeight) *
          player.height
        );

        if (
          maskX < 0 ||
          maskX >= player.width ||
          maskY < 0 ||
          maskY >= player.height
        ) {
          return false;
        }

        return (
          player.pixels[
            maskY * player.width + maskX
          ] === 255
        );
      }

      function laserHitsPlayer(laserObject) {
        if (!player.tracked || !player.pixels) {
          return false;
        }

        const step = 7;
        const halfThickness =
          laserObject.thickness / 2;

        if (
          laserObject.orientation ===
          "horizontal"
        ) {
          const y = laserObject.linePosition;

          for (
            let x = 0;
            x < window.innerWidth;
            x += step
          ) {
            for (
              let offset = -halfThickness;
              offset <= halfThickness;
              offset += 6
            ) {
              if (
                bodyMaskContainsScreenPoint(
                  x,
                  y + offset
                )
              ) {
                return true;
              }
            }
          }

          return false;
        }

        const x = laserObject.linePosition;

        for (
          let y = 0;
          y < window.innerHeight;
          y += step
        ) {
          for (
            let offset = -halfThickness;
            offset <= halfThickness;
            offset += 6
          ) {
            if (
              bodyMaskContainsScreenPoint(
                x + offset,
                y
              )
            ) {
              return true;
            }
          }
        }

        return false;
      }

      function drawBodyMask() {
        if (!player.tracked || !player.pixels) {
          return;
        }

        ctx.save();

        ctx.globalAlpha = 0.74;
        ctx.imageSmoothingEnabled = true;

        ctx.drawImage(
          maskCanvas,
          0,
          0,
          player.width,
          player.height,
          0,
          0,
          window.innerWidth,
          window.innerHeight
        );

        ctx.restore();
      }

      function drawFaceGuide() {
        if (
          gameStarted ||
          !faceDetector ||
          gameOver
        ) {
          return;
        }

        const x = faceState.centerX * window.innerWidth;
        const y = faceState.centerY * window.innerHeight;

        ctx.save();

        /*
          Center-stage-style frame guide. It is only an indicator;
          it is not part of collision or body tracking.
        */
        ctx.strokeStyle = faceState.valid
          ? "#62ffc1"
          : "#ffe66d";

        ctx.lineWidth = 3;
        ctx.setLineDash([8, 7]);

        const guideWidth =
          window.innerWidth *
          (faceCenterMaxX - faceCenterMinX);

        const guideHeight =
          window.innerHeight *
          (faceCenterMaxY - faceCenterMinY);

        const guideX =
          window.innerWidth * faceCenterMinX;

        const guideY =
          window.innerHeight * faceCenterMinY;

        ctx.strokeRect(
          guideX,
          guideY,
          guideWidth,
          guideHeight
        );

        ctx.setLineDash([]);

        if (faceState.valid) {
          ctx.fillStyle = "#62ffc1";
          ctx.beginPath();
          ctx.arc(x, y, 7, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.restore();
      }

      function drawLaser() {
        if (!laser) {
          return;
        }

        const elapsed =
          performance.now() - laser.createdAt;

        const warning = !laser.active;

        const warningProgress = warning
          ? Math.min(
              1,
              elapsed / laser.warningTime
            )
          : 1;

        const pulse =
          0.62 +
          Math.sin(performance.now() / 75) * 0.25;

        ctx.save();

        if (
          laser.orientation ===
          "horizontal"
        ) {
          const y = laser.linePosition;

          if (warning) {
            ctx.strokeStyle =
              `rgba(255, 88, 88, ${
                0.30 + warningProgress * 0.40
              })`;

            ctx.lineWidth = 3;
            ctx.setLineDash([10, 9]);

            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(window.innerWidth, y);
            ctx.stroke();

            ctx.setLineDash([]);

            ctx.fillStyle = "#ffe1dc";
            ctx.font = "bold 13px Arial";
            ctx.textAlign = "center";

            ctx.fillText(
              "LASER LOCKING",
              window.innerWidth / 2,
              Math.max(24, y - 16)
            );

          } else {
            ctx.strokeStyle =
              `rgba(255, 24, 48, ${pulse})`;

            ctx.lineWidth =
              laser.thickness + 16;

            ctx.shadowColor = "#ff1732";
            ctx.shadowBlur = 28;

            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(window.innerWidth, y);
            ctx.stroke();

            ctx.shadowBlur = 0;
            ctx.strokeStyle = "#fff2f2";
            ctx.lineWidth = 3;

            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(window.innerWidth, y);
            ctx.stroke();
          }

        } else {
          const x = laser.linePosition;

          if (warning) {
            ctx.strokeStyle =
              `rgba(255, 88, 88, ${
                0.30 + warningProgress * 0.40
              })`;

            ctx.lineWidth = 3;
            ctx.setLineDash([10, 9]);

            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, window.innerHeight);
            ctx.stroke();

            ctx.setLineDash([]);

            ctx.save();

            ctx.translate(
              x - 15,
              window.innerHeight / 2
            );

            ctx.rotate(-Math.PI / 2);

            ctx.fillStyle = "#ffe1dc";
            ctx.font = "bold 13px Arial";
            ctx.textAlign = "center";

            ctx.fillText(
              "LASER LOCKING",
              0,
              0
            );

            ctx.restore();

          } else {
            ctx.strokeStyle =
              `rgba(255, 24, 48, ${pulse})`;

            ctx.lineWidth =
              laser.thickness + 16;

            ctx.shadowColor = "#ff1732";
            ctx.shadowBlur = 28;

            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, window.innerHeight);
            ctx.stroke();

            ctx.shadowBlur = 0;
            ctx.strokeStyle = "#fff2f2";
            ctx.lineWidth = 3;

            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, window.innerHeight);
            ctx.stroke();
          }
        }

        ctx.restore();
      }

      function drawWaitingOverlay() {
        if (gameStarted || gameOver) {
          return;
        }

        ctx.save();

        ctx.fillStyle = "rgba(0, 0, 0, 0.46)";

        ctx.fillRect(
          0,
          window.innerHeight - 70,
          window.innerWidth,
          70
        );

        ctx.fillStyle = "#ffe66d";
        ctx.font = "bold 16px Arial";
        ctx.textAlign = "center";

        let message =
          "LOADING FACE AND BODY TRACKING…";

        if (faceDetector && segmenter) {
          if (
            stableFaceFrames <
            requiredStableFaceFrames
          ) {
            message =
              "CENTER ONE FACE IN THE GUIDE — LASERS OFF";
          } else if (
            stableBodyFrames <
            requiredStableBodyFrames
          ) {
            message =
              "FACE CONFIRMED — CHECKING BODY SILHOUETTE";
          }
        }

        ctx.fillText(
          message,
          window.innerWidth / 2,
          window.innerHeight - 30
        );

        ctx.restore();
      }

      function drawGameOver() {
        if (!gameOver) {
          return;
        }

        ctx.save();

        ctx.fillStyle = "rgba(0, 0, 0, 0.70)";

        ctx.fillRect(
          0,
          0,
          window.innerWidth,
          window.innerHeight
        );

        ctx.fillStyle = "#ff6875";
        ctx.font = "bold 34px Arial";
        ctx.textAlign = "center";

        ctx.fillText(
          "GAME OVER",
          window.innerWidth / 2,
          window.innerHeight / 2 - 20
        );

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 18px Arial";

        ctx.fillText(
          `Final score: ${score}`,
          window.innerWidth / 2,
          window.innerHeight / 2 + 20
        );

        ctx.font = "15px Arial";

        ctx.fillText(
          "Refresh the page to play again",
          window.innerWidth / 2,
          window.innerHeight / 2 + 54
        );

        ctx.restore();
      }

      function draw() {
        ctx.clearRect(
          0,
          0,
          window.innerWidth,
          window.innerHeight
        );

        drawBodyMask();
        drawFaceGuide();
        drawLaser();
        drawWaitingOverlay();
        drawGameOver();
      }

      function loop(timestamp) {
        if (!running) {
          return;
        }

        updateFaceTracking(timestamp);
        updateBodySegmentation(timestamp);
        updateLaser(timestamp);

        draw();
        updateHud();

        requestAnimationFrame(loop);
      }

      permissionButton.addEventListener(
        "click",
        enableCamera
      );

      window.addEventListener(
        "resize",
        resizeCanvas
      );

      window.addEventListener(
        "pagehide",
        () => {
          if (mediaStream) {
            mediaStream.getTracks().forEach(
              (track) => track.stop()
            );
          }

          if (
            faceDetector &&
            typeof faceDetector.dispose === "function"
          ) {
            faceDetector.dispose();
          }

          if (
            segmenter &&
            typeof segmenter.dispose === "function"
          ) {
            segmenter.dispose();
          }
        }
      );

      resizeCanvas();
      updateHud();
    })();
  </script>
</body>
</html>
