<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no"
  />
  <meta name="theme-color" content="#090909" />
  <title>Mobility Dodge — Segmentation Mask</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #090909;
      font-family: Arial, Helvetica, sans-serif;
    }

    #app,
    #video,
    #canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #app {
      overflow: hidden;
      background: #090909;
    }

    #video {
      z-index: 1;
      object-fit: cover;
      transform: scaleX(-1);
      opacity: 0.38;
      background: #000;
    }

    #canvas {
      z-index: 2;
      pointer-events: none;
    }

    #info {
      position: fixed;
      z-index: 5;
      top: 12px;
      left: 12px;
      max-width: calc(100vw - 24px);
      padding: 10px 12px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.72);
      color: #ffffff;
      font-size: 15px;
      line-height: 1.4;
    }

    #permission-panel {
      position: fixed;
      z-index: 10;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(
          circle at center,
          rgba(35, 74, 82, 0.45),
          rgba(0, 0, 0, 0.88) 65%
        );
    }

    #permission-card {
      width: min(430px, 100%);
      padding: 24px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 16px;
      background: rgba(12, 12, 12, 0.95);
      color: #ffffff;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    }

    #permission-card h1 {
      margin: 0 0 12px;
      font-size: 24px;
    }

    #permission-card p {
      margin: 0 0 18px;
      color: #d7d7d7;
      font-size: 15px;
      line-height: 1.5;
    }

    #camera-permission {
      min-width: 190px;
      padding: 13px 18px;
      border: 0;
      border-radius: 10px;
      background: #55e6ff;
      color: #001018;
      cursor: pointer;
      font-size: 16px;
      font-weight: 700;
    }

    #camera-permission:hover {
      background: #8aeeff;
    }

    #camera-permission:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>
  <main id="app">
    <video id="video" autoplay muted playsinline></video>
    <canvas id="canvas"></canvas>

    <div id="info">Camera access is required.</div>

    <section id="permission-panel" aria-live="polite">
      <div id="permission-card">
        <h1>Mobility Dodge</h1>

        <p id="permission-message">
          Allow camera access to create your live body silhouette.
        </p>

        <button id="camera-permission" type="button">
          Allow Camera
        </button>
      </div>
    </section>
  </main>

  <script>
    (() => {
      const video = document.getElementById("video");
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");

      const info = document.getElementById("info");
      const permissionPanel = document.getElementById("permission-panel");
      const permissionMessage = document.getElementById("permission-message");
      const permissionButton = document.getElementById("camera-permission");

      /*
        A small offscreen canvas holds the current mask.
        It is not added to the page.
      */
      const maskCanvas = document.createElement("canvas");
      const maskCtx = maskCanvas.getContext(
        "2d",
        { willReadFrequently: true }
      );

      let mediaStream = null;
      let poseLandmarker = null;
      let poseLoading = false;

      let lastVideoTime = -1;
      let lastSegmentationAt = 0;

      let running = false;
      let gameOver = false;

      let score = 0;
      let health = 3;
      let projectile = null;
      let lastSpawnTime = 0;

      /*
        20 FPS for mask inference. The normal draw loop remains
        requestAnimationFrame speed.
      */
      const segmentationIntervalMs = 50;

      /*
        Person-mask confidence threshold. Raise this when the mask
        includes too much background; lower it if the silhouette
        becomes too fragmented.
      */
      const maskThreshold = 0.55;

      /*
        Persist the last valid silhouette briefly to avoid flicker
        if MediaPipe misses one video frame.
      */
      const trackingGraceMs = 650;

      const player = {
        tracked: false,
        lastTrackedAt: 0,

        /*
          This is a binary Uint8Array:
          255 = player pixel
          0 = background
        */
        pixels: null,

        width: 0,
        height: 0,

        /*
          Screen-space bounding rectangle of active body pixels.
          Used only to make collision work faster.
        */
        minX: 0,
        minY: 0,
        maxX: 0,
        maxY: 0
      };

      function resizeCanvas() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);

        canvas.width = Math.floor(window.innerWidth * dpr);
        canvas.height = Math.floor(window.innerHeight * dpr);

        canvas.style.width = `${window.innerWidth}px`;
        canvas.style.height = `${window.innerHeight}px`;

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function resetPlayerMask() {
        player.tracked = false;
        player.lastTrackedAt = 0;
        player.pixels = null;
        player.width = 0;
        player.height = 0;
        player.minX = 0;
        player.minY = 0;
        player.maxX = 0;
        player.maxY = 0;

        maskCanvas.width = 1;
        maskCanvas.height = 1;
      }

      function resetGame() {
        score = 0;
        health = 3;
        projectile = null;
        lastSpawnTime = performance.now();

        lastVideoTime = -1;
        lastSegmentationAt = 0;
        loop.lastTime = undefined;

        resetPlayerMask();

        gameOver = false;
      }

      function showCameraError(error) {
        console.error("Camera error:", error);

        permissionButton.disabled = false;
        permissionButton.textContent = "Try Camera Again";

        let message = "";

        if (!window.isSecureContext) {
          message =
            "Camera access requires HTTPS. Open your GitHub Pages URL, not a downloaded file or HTTP address.";
        } else if (!navigator.mediaDevices?.getUserMedia) {
          message =
            "This browser does not support camera access through MediaDevices.";
        } else if (error?.name === "NotAllowedError") {
          message =
            "Camera permission was blocked. Use the camera or lock icon in the address bar, allow the camera for this site, then try again.";
        } else if (error?.name === "NotFoundError") {
          message =
            "No usable camera was found on this device.";
        } else if (error?.name === "NotReadableError") {
          message =
            "The camera is in use by another app or browser tab.";
        } else {
          message =
            `Camera could not start: ${
              error?.message || error?.name || "Unknown error"
            }`;
        }

        permissionMessage.textContent = message;
        info.textContent = "Camera access has not been granted.";
      }

      async function enableCamera(event) {
        event.preventDefault();

        if (mediaStream) {
          permissionPanel.classList.add("hidden");
          return;
        }

        if (!window.isSecureContext) {
          showCameraError(
            new Error("This page is not running in a secure context.")
          );
          return;
        }

        if (!navigator.mediaDevices?.getUserMedia) {
          showCameraError(
            new Error("navigator.mediaDevices.getUserMedia is unavailable.")
          );
          return;
        }

        try {
          permissionButton.disabled = true;
          permissionButton.textContent = "Requesting Access…";

          permissionMessage.textContent =
            "Your browser should now display its camera permission dialog.";

          /*
            Call this directly from the button event. Browser camera
            permission prompts require a real user gesture.
          */
          const stream = await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: false
          });

          mediaStream = stream;
          video.srcObject = stream;

          await video.play();

          resetGame();

          permissionPanel.classList.add("hidden");

          info.textContent =
            "Camera active. Loading body segmentation…";

          running = true;

          requestAnimationFrame(loop);

          loadPoseTracking();

        } catch (error) {
          showCameraError(error);
        }
      }

      async function loadPoseTracking() {
        if (poseLandmarker || poseLoading) {
          return;
        }

        poseLoading = true;

        try {
          const {
            FilesetResolver,
            PoseLandmarker
          } = await import(
            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm"
          );

          const vision = await FilesetResolver.forVisionTasks(
            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"
          );

          poseLandmarker = await PoseLandmarker.createFromOptions(
            vision,
            {
              baseOptions: {
                modelAssetPath:
                  "https://storage.googleapis.com/mediapipe-models/" +
                  "pose_landmarker/pose_landmarker_lite/float16/1/" +
                  "pose_landmarker_lite.task",
                delegate: "CPU"
              },
              runningMode: "VIDEO",
              numPoses: 1,

              /*
                This enables result.segmentationMasks.
              */
              outputSegmentationMasks: true,

              minPoseDetectionConfidence: 0.55,
              minPosePresenceConfidence: 0.55,
              minTrackingConfidence: 0.55
            }
          );

          info.textContent =
            "Segmentation ready. Stand in view to activate your body silhouette.";

        } catch (error) {
          console.warn("Body segmentation could not load:", error);

          info.textContent =
            "Camera active, but body segmentation could not load.";

        } finally {
          poseLoading = false;
        }
      }

      function clearPlayerMask() {
        player.tracked = false;
        player.pixels = null;
        player.width = 0;
        player.height = 0;
        player.minX = 0;
        player.minY = 0;
        player.maxX = 0;
        player.maxY = 0;
      }

      /*
        Convert MediaPipe's single-channel confidence mask into:
        1. a binary hit-test array
        2. a green RGBA image for drawing
        3. an active-pixel bounding box for fast rejection

        The video is mirrored in CSS. Therefore the code mirrors
        mask X values while writing to the screen-aligned mask.
      */
      function updatePlayerMask(mask) {
        const sourceWidth = mask.width;
        const sourceHeight = mask.height;

        if (!sourceWidth || !sourceHeight) {
          clearPlayerMask();
          return;
        }

        /*
          MPMask can provide a Float32Array with person confidence
          values. Copy it immediately while the result is valid.
        */
        const confidence = mask.getAsFloat32Array();

        const binary = new Uint8Array(
          sourceWidth * sourceHeight
        );

        const rgba = new Uint8ClampedArray(
          sourceWidth * sourceHeight * 4
        );

        let minX = sourceWidth;
        let minY = sourceHeight;
        let maxX = -1;
        let maxY = -1;

        for (let y = 0; y < sourceHeight; y += 1) {
          for (let x = 0; x < sourceWidth; x += 1) {
            const sourceIndex = y * sourceWidth + x;

            /*
              Store the mirrored value. This aligns it with the
              CSS-mirrored video and screen-space projectile logic.
            */
            const mirroredX = sourceWidth - 1 - x;

            const targetIndex =
              y * sourceWidth + mirroredX;

            const value = confidence[sourceIndex];

            if (value >= maskThreshold) {
              binary[targetIndex] = 255;

              const colorIndex = targetIndex * 4;

              rgba[colorIndex] = 82;
              rgba[colorIndex + 1] = 255;
              rgba[colorIndex + 2] = 183;
              rgba[colorIndex + 3] = 150;

              if (mirroredX < minX) minX = mirroredX;
              if (mirroredX > maxX) maxX = mirroredX;
              if (y < minY) minY = y;
              if (y > maxY) maxY = y;
            }
          }
        }

        if (maxX < minX || maxY < minY) {
          clearPlayerMask();
          return;
        }

        maskCanvas.width = sourceWidth;
        maskCanvas.height = sourceHeight;

        const imageData = new ImageData(
          rgba,
          sourceWidth,
          sourceHeight
        );

        maskCtx.putImageData(imageData, 0, 0);

        player.pixels = binary;
        player.width = sourceWidth;
        player.height = sourceHeight;
        player.minX = minX;
        player.minY = minY;
        player.maxX = maxX;
        player.maxY = maxY;
        player.tracked = true;
      }

      function updateSegmentation(timestamp) {
        if (
          !poseLandmarker ||
          video.readyState < HTMLMediaElement.HAVE_CURRENT_DATA
        ) {
          return;
        }

        if (timestamp - lastSegmentationAt < segmentationIntervalMs) {
          return;
        }

        if (video.currentTime === lastVideoTime) {
          return;
        }

        lastSegmentationAt = timestamp;
        lastVideoTime = video.currentTime;

        let result = null;

        try {
          result = poseLandmarker.detectForVideo(
            video,
            timestamp
          );

          const mask = result.segmentationMasks?.[0];

          if (!mask) {
            if (
              timestamp - player.lastTrackedAt >
              trackingGraceMs
            ) {
              clearPlayerMask();
            }

            return;
          }

          updatePlayerMask(mask);

          if (player.tracked) {
            player.lastTrackedAt = timestamp;
          }

        } catch (error) {
          console.warn("Segmentation frame failed:", error);
        } finally {
          /*
            MediaPipe MPMask objects own native/WASM resources.
            Close the result masks once their values have been copied.
          */
          if (result?.segmentationMasks) {
            result.segmentationMasks.forEach((resultMask) => {
              if (typeof resultMask.close === "function") {
                resultMask.close();
              }
            });
          }
        }
      }

      function spawnProjectile() {
        /*
          No body silhouette means no dangerous projectile.
        */
        if (!player.tracked || !player.pixels) {
          return;
        }

        const fromLeft = Math.random() > 0.5;

        const startX = fromLeft
          ? -60
          : window.innerWidth + 60;

        const startY =
          80 +
          Math.random() *
          Math.max(80, window.innerHeight - 160);

        /*
          Choose a random active body-mask pixel as the warning target.
        */
        const target = randomBodyPoint();

        if (!target) {
          return;
        }

        const dx = target.x - startX;
        const dy = target.y - startY;

        const length = Math.hypot(dx, dy) || 1;
        const speed = 500;

        projectile = {
          x: startX,
          y: startY,
          vx: (dx / length) * speed,
          vy: (dy / length) * speed,
          targetX: target.x,
          targetY: target.y,
          radius: 16,
          createdAt: performance.now(),
          warningTime: 700,
          fired: false
        };
      }

      function randomBodyPoint() {
        if (!player.pixels || !player.tracked) {
          return null;
        }

        /*
          Try random pixels inside the active bounding box.
          This is much cheaper than rebuilding a full list every frame.
        */
        for (let attempt = 0; attempt < 80; attempt += 1) {
          const maskX =
            player.minX +
            Math.floor(
              Math.random() *
              (player.maxX - player.minX + 1)
            );

          const maskY =
            player.minY +
            Math.floor(
              Math.random() *
              (player.maxY - player.minY + 1)
            );

          const index =
            maskY * player.width + maskX;

          if (player.pixels[index] === 255) {
            return {
              x: ((maskX + 0.5) / player.width) *
                window.innerWidth,

              y: ((maskY + 0.5) / player.height) *
                window.innerHeight
            };
          }
        }

        /*
          A fallback point in the center of the body bounding box.
        */
        return {
          x:
            ((player.minX + player.maxX + 1) /
              (2 * player.width)) *
            window.innerWidth,

          y:
            ((player.minY + player.maxY + 1) /
              (2 * player.height)) *
            window.innerHeight
        };
      }

      function bodyMaskContainsScreenPoint(screenX, screenY) {
        if (
          !player.tracked ||
          !player.pixels ||
          player.width <= 0 ||
          player.height <= 0
        ) {
          return false;
        }

        const maskX = Math.floor(
          (screenX / window.innerWidth) * player.width
        );

        const maskY = Math.floor(
          (screenY / window.innerHeight) * player.height
        );

        if (
          maskX < 0 ||
          maskX >= player.width ||
          maskY < 0 ||
          maskY >= player.height
        ) {
          return false;
        }

        const index =
          maskY * player.width + maskX;

        return player.pixels[index] === 255;
      }

      function projectileHitsBody(projectileObject) {
        if (!player.tracked || !player.pixels) {
          return false;
        }

        /*
          Center plus eight perimeter samples makes projectile
          collision more forgiving than a one-pixel point test.
        */
        const radius = projectileObject.radius;

        const samples = [
          [0, 0],
          [radius, 0],
          [-radius, 0],
          [0, radius],
          [0, -radius],
          [radius * 0.7, radius * 0.7],
          [-radius * 0.7, radius * 0.7],
          [radius * 0.7, -radius * 0.7],
          [-radius * 0.7, -radius * 0.7]
        ];

        return samples.some(([offsetX, offsetY]) =>
          bodyMaskContainsScreenPoint(
            projectileObject.x + offsetX,
            projectileObject.y + offsetY
          )
        );
      }

      function projectileOut() {
        const padding = 110;

        return (
          projectile.x < -padding ||
          projectile.x > window.innerWidth + padding ||
          projectile.y < -padding ||
          projectile.y > window.innerHeight + padding
        );
      }

      function updateProjectile(timestamp, deltaMs) {
        if (!projectile) {
          if (!player.tracked) {
            return;
          }

          if (timestamp - lastSpawnTime > 1300) {
            spawnProjectile();
            lastSpawnTime = timestamp;
          }

          return;
        }

        if (!projectile.fired) {
          if (
            timestamp - projectile.createdAt >=
            projectile.warningTime
          ) {
            projectile.fired = true;
          }

          return;
        }

        const dt = deltaMs / 1000;

        projectile.x += projectile.vx * dt;
        projectile.y += projectile.vy * dt;

        /*
          Only green segmentation-mask pixels can take damage.
        */
        if (projectileHitsBody(projectile)) {
          health -= 1;
          projectile = null;

          if (health <= 0) {
            running = false;
            gameOver = true;

            info.textContent =
              `Game over | Score: ${score} | Refresh to play again.`;
          }

          return;
        }

        if (projectile && projectileOut()) {
          score += 1;
          projectile = null;
        }
      }

      function drawBodyMask() {
        if (!player.tracked || !player.pixels) {
          return;
        }

        ctx.save();

        /*
          Draw the low-resolution green mask enlarged to the screen.
          The mask was already mirrored when written, matching video.
        */
        ctx.imageSmoothingEnabled = true;
        ctx.globalAlpha = 0.82;

        ctx.drawImage(
          maskCanvas,
          0,
          0,
          player.width,
          player.height,
          0,
          0,
          window.innerWidth,
          window.innerHeight
        );

        /*
          Add a bright label above the visible silhouette.
        */
        const topY =
          (player.minY / player.height) *
          window.innerHeight;

        const centerX =
          ((player.minX + player.maxX) /
            (2 * player.width)) *
          window.innerWidth;

        ctx.globalAlpha = 1;
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 12px Arial";
        ctx.textAlign = "center";

        ctx.fillText(
          "BODY MASK — DAMAGE ACTIVE",
          centerX,
          Math.max(22, topY - 14)
        );

        ctx.restore();
      }

      function drawProjectile() {
        if (!projectile) {
          return;
        }

        if (!projectile.fired) {
          ctx.save();

          ctx.strokeStyle = "#ffdf5c";
          ctx.lineWidth = 2;
          ctx.setLineDash([8, 7]);

          ctx.beginPath();
          ctx.moveTo(projectile.x, projectile.y);
          ctx.lineTo(
            projectile.targetX,
            projectile.targetY
          );
          ctx.stroke();

          ctx.setLineDash([]);

          ctx.beginPath();
          ctx.arc(
            projectile.targetX,
            projectile.targetY,
            24,
            0,
            Math.PI * 2
          );
          ctx.stroke();

          ctx.restore();

          return;
        }

        ctx.save();

        ctx.fillStyle = "#51e5ff";

        ctx.beginPath();
        ctx.arc(
          projectile.x,
          projectile.y,
          projectile.radius,
          0,
          Math.PI * 2
        );
        ctx.fill();

        ctx.strokeStyle = "#e2ffff";
        ctx.lineWidth = 2;

        ctx.beginPath();
        ctx.arc(
          projectile.x,
          projectile.y,
          projectile.radius + 4,
          0,
          Math.PI * 2
        );
        ctx.stroke();

        ctx.restore();
      }

      function drawWaitingStatus() {
        if (player.tracked || gameOver) {
          return;
        }

        ctx.save();

        ctx.fillStyle = "rgba(0, 0, 0, 0.45)";
        ctx.fillRect(
          0,
          window.innerHeight - 62,
          window.innerWidth,
          62
        );

        ctx.fillStyle = "#ffe66d";
        ctx.font = "bold 16px Arial";
        ctx.textAlign = "center";

        const message = poseLandmarker
          ? "LOOKING FOR BODY SILHOUETTE — DAMAGE OFF"
          : "LOADING BODY SEGMENTATION — DAMAGE OFF";

        ctx.fillText(
          message,
          window.innerWidth / 2,
          window.innerHeight - 26
        );

        ctx.restore();
      }

      function draw() {
        ctx.clearRect(
          0,
          0,
          window.innerWidth,
          window.innerHeight
        );

        drawBodyMask();
        drawProjectile();
        drawWaitingStatus();
      }

      function updateInfo() {
        if (gameOver) {
          return;
        }

        const trackingState = player.tracked
          ? "Green body mask: damage active"
          : "Body mask required: damage off";

        info.textContent =
          `Score: ${score} | Health: ${health} | ${trackingState}`;
      }

      function loop(timestamp) {
        if (!running) {
          return;
        }

        const previousTime = loop.lastTime ?? timestamp;

        const deltaMs = Math.min(
          timestamp - previousTime,
          50
        );

        loop.lastTime = timestamp;

        updateSegmentation(timestamp);
        updateProjectile(timestamp, deltaMs);

        draw();
        updateInfo();

        requestAnimationFrame(loop);
      }

      permissionButton.addEventListener(
        "click",
        enableCamera
      );

      window.addEventListener(
        "resize",
        resizeCanvas
      );

      window.addEventListener(
        "pagehide",
        () => {
          if (mediaStream) {
            mediaStream.getTracks().forEach(
              (track) => track.stop()
            );
          }
        }
      );

      resizeCanvas();
    })();
  </script>
</body>
</html>
