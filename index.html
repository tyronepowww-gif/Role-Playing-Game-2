<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
  />
  <title>Mobility Dodge</title>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: Arial, sans-serif;
    }

    video,
    canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
    }

    video {
      z-index: 1;
      object-fit: cover;
      transform: scaleX(-1);
      opacity: 0.35;
    }

    canvas {
      z-index: 2;
      pointer-events: none;
    }

    #info {
      position: fixed;
      z-index: 5;
      top: 12px;
      left: 12px;
      padding: 10px;
      background: rgba(0, 0, 0, 0.65);
      color: white;
      font-size: 16px;
    }

    #start {
      position: fixed;
      z-index: 10;
      top: 50%;
      left: 50%;
      padding: 16px 24px;
      border: 0;
      border-radius: 10px;
      background: #55e6ff;
      color: #001019;
      cursor: pointer;
      font-size: 18px;
      font-weight: bold;
      transform: translate(-50%, -50%);
    }

    #start:disabled {
      opacity: 0.65;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>
  <video id="video" autoplay muted playsinline></video>
  <canvas id="canvas"></canvas>

  <div id="info">Score: 0 | Health: 3 | Loading...</div>

  <button id="start">Start Camera</button>

  <script type="module">
    import {
      FilesetResolver,
      PoseLandmarker
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm";

    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const info = document.getElementById("info");
    const startButton = document.getElementById("start");

    let poseLandmarker = null;
    let lastVideoTime = -1;
    let running = false;
    let score = 0;
    let health = 3;
    let lastSpawn = 0;

    const player = {
      x: window.innerWidth / 2,
      y: window.innerHeight / 2,
      radius: 38
    };

    let projectile = null;

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);

      canvas.width = Math.floor(window.innerWidth * dpr);
      canvas.height = Math.floor(window.innerHeight * dpr);

      canvas.style.width = `${window.innerWidth}px`;
      canvas.style.height = `${window.innerHeight}px`;

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    async function startCamera() {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: true,
        audio: false
      });

      video.srcObject = stream;
      await video.play();
    }

    async function startPoseTracking() {
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"
      );

      poseLandmarker =
        await PoseLandmarker.createFromOptions(vision, {
          baseOptions: {
            modelAssetPath:
              "https://storage.googleapis.com/mediapipe-models/" +
              "pose_landmarker/pose_landmarker_lite/float16/1/" +
              "pose_landmarker_lite.task",
            delegate: "CPU"
          },
          runningMode: "VIDEO",
          numPoses: 1
        });
    }

    function updatePlayer(timestamp) {
      if (
        !poseLandmarker ||
        video.readyState < HTMLMediaElement.HAVE_CURRENT_DATA
      ) {
        return;
      }

      if (video.currentTime === lastVideoTime) {
        return;
      }

      lastVideoTime = video.currentTime;

      const result = poseLandmarker.detectForVideo(
        video,
        timestamp
      );

      if (!result.landmarks?.length) {
        return;
      }

      const nose = result.landmarks[0][0];

      if (!nose) {
        return;
      }

      player.x = (1 - nose.x) * window.innerWidth;
      player.y = nose.y * window.innerHeight;
    }

    function spawnProjectile() {
      const fromLeft = Math.random() > 0.5;

      const startX = fromLeft ? -40 : window.innerWidth + 40;
      const startY =
        80 + Math.random() * (window.innerHeight - 160);

      /*
        Lock the projectile to the player's current position.
        The player can dodge after this target is chosen.
      */
      const targetX = player.x;
      const targetY = player.y;

      const dx = targetX - startX;
      const dy = targetY - startY;
      const distance = Math.hypot(dx, dy) || 1;
      const speed = 520;

      projectile = {
        x: startX,
        y: startY,
        vx: (dx / distance) * speed,
        vy: (dy / distance) * speed,
        targetX,
        targetY,
        radius: 15,
        createdAt: performance.now(),
        warningTime: 600,
        fired: false
      };
    }

    function hitTest() {
      if (!projectile) return false;

      const dx = projectile.x - player.x;
      const dy = projectile.y - player.y;
      const distance = Math.hypot(dx, dy);

      return distance < projectile.radius + player.radius;
    }

    function projectileOut() {
      const padding = 100;

      return (
        projectile.x < -padding ||
        projectile.x > window.innerWidth + padding ||
        projectile.y < -padding ||
        projectile.y > window.innerHeight + padding
      );
    }

    function updateProjectile(timestamp, deltaMs) {
      if (!projectile) {
        if (timestamp - lastSpawn > 1200) {
          spawnProjectile();
          lastSpawn = timestamp;
        }

        return;
      }

      if (!projectile.fired) {
        if (
          timestamp - projectile.createdAt >=
          projectile.warningTime
        ) {
          projectile.fired = true;
        }

        return;
      }

      const dt = deltaMs / 1000;

      projectile.x += projectile.vx * dt;
      projectile.y += projectile.vy * dt;

      if (hitTest()) {
        health -= 1;
        projectile = null;

        if (health <= 0) {
          running = false;
          info.textContent =
            `Game Over | Score: ${score} | Click Start Camera to restart`;

          startButton.textContent = "Restart";
          startButton.classList.remove("hidden");
        }
      }

      if (projectile && projectileOut()) {
        score += 1;
        projectile = null;
      }
    }

    function drawPlayer() {
      ctx.strokeStyle = "#4dffbf";
      ctx.lineWidth = 3;

      ctx.beginPath();
      ctx.arc(
        player.x,
        player.y,
        player.radius,
        0,
        Math.PI * 2
      );
      ctx.stroke();

      ctx.fillStyle = "#baffea";

      ctx.beginPath();
      ctx.arc(
        player.x,
        player.y,
        8,
        0,
        Math.PI * 2
      );
      ctx.fill();
    }

    function drawProjectile(timestamp) {
      if (!projectile) return;

      if (!projectile.fired) {
        ctx.strokeStyle = "#ffe66d";
        ctx.lineWidth = 2;
        ctx.setLineDash([7, 7]);

        ctx.beginPath();
        ctx.moveTo(projectile.x, projectile.y);
        ctx.lineTo(
          projectile.targetX,
          projectile.targetY
        );
        ctx.stroke();

        ctx.setLineDash([]);

        ctx.beginPath();
        ctx.arc(
          projectile.targetX,
          projectile.targetY,
          24,
          0,
          Math.PI * 2
        );
        ctx.stroke();

        return;
      }

      ctx.fillStyle = "#52e8ff";

      ctx.beginPath();
      ctx.arc(
        projectile.x,
        projectile.y,
        projectile.radius,
        0,
        Math.PI * 2
      );
      ctx.fill();

      ctx.strokeStyle = "#d9ffff";
      ctx.lineWidth = 2;

      ctx.beginPath();
      ctx.arc(
        projectile.x,
        projectile.y,
        projectile.radius + 4,
        0,
        Math.PI * 2
      );
      ctx.stroke();
    }

    function draw(timestamp) {
      ctx.clearRect(
        0,
        0,
        window.innerWidth,
        window.innerHeight
      );

      drawPlayer();
      drawProjectile(timestamp);
    }

    function loop(timestamp) {
      if (!running) return;

      const deltaMs = Math.min(
        timestamp - (loop.lastTime || timestamp),
        50
      );

      loop.lastTime = timestamp;

      updatePlayer(timestamp);
      updateProjectile(timestamp, deltaMs);
      draw(timestamp);

      info.textContent =
        `Score: ${score} | Health: ${health} | Move your head to dodge`;

      requestAnimationFrame(loop);
    }

    async function startGame() {
      try {
        startButton.disabled = true;
        startButton.textContent = "Starting Camera...";

        /*
          First: native browser camera permission.
          Nothing else needs to happen for the permission popup.
        */
        await startCamera();

        /*
          Second: load the pose tracker after camera starts.
        */
        await startPoseTracking();

        score = 0;
        health = 3;
        projectile = null;
        lastSpawn = performance.now();
        running = true;

        startButton.classList.add("hidden");

        info.textContent =
          "Game started. Move your head to dodge.";

        requestAnimationFrame(loop);
      } catch (error) {
        console.error(error);

        info.textContent =
          `Error: ${error.name || ""} ${error.message || ""}`;

        startButton.disabled = false;
        startButton.textContent = "Try Again";
      }
    }

    startButton.addEventListener("click", startGame);

    window.addEventListener("resize", resize);

    resize();
  </script>
</body>
</html>
