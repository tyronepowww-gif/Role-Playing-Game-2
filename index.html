<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1.0,maximum-scale=1,user-scalable=no"
  />
  <title>Mobility Dodge</title>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #090909;
      font-family: Arial, Helvetica, sans-serif;
    }

    video,
    canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
    }

    video {
      z-index: 1;
      object-fit: cover;
      transform: scaleX(-1);
      opacity: 0.38;
      background: #000;
    }

    canvas {
      z-index: 2;
      pointer-events: none;
    }

    #info {
      position: fixed;
      z-index: 5;
      top: 12px;
      left: 12px;
      max-width: calc(100vw - 24px);
      padding: 10px 12px;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      font-size: 15px;
      line-height: 1.4;
    }

    #start {
      position: fixed;
      z-index: 10;
      top: 50%;
      left: 50%;
      padding: 16px 24px;
      border: 0;
      border-radius: 10px;
      background: #55e6ff;
      color: #001018;
      cursor: pointer;
      font-size: 18px;
      font-weight: bold;
      transform: translate(-50%, -50%);
    }

    #start:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>
  <video id="video" autoplay muted playsinline></video>
  <canvas id="canvas"></canvas>

  <div id="info">Click Start Camera</div>

  <button id="start">Start Camera</button>

  <script type="module">
    import {
      FilesetResolver,
      PoseLandmarker
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm";

    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const info = document.getElementById("info");
    const startButton = document.getElementById("start");

    let poseLandmarker = null;
    let lastVideoTime = -1;
    let running = false;
    let animationStarted = false;

    let score = 0;
    let health = 3;
    let projectile = null;
    let lastSpawnTime = 0;

    /*
      This object is the player hit zone.

      Yellow:
      Default zone before a person is detected.

      Green:
      Person detected. Zone is now sized around
      the head-and-upper-body space of the user.
    */
    const player = {
      x: window.innerWidth / 2,
      y: window.innerHeight / 2,
      radiusX: 75,
      radiusY: 100,
      tracked: false
    };

    function resizeCanvas() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);

      canvas.width = Math.floor(window.innerWidth * dpr);
      canvas.height = Math.floor(window.innerHeight * dpr);

      canvas.style.width = `${window.innerWidth}px`;
      canvas.style.height = `${window.innerHeight}px`;

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      if (!player.tracked) {
        player.x = window.innerWidth / 2;
        player.y = window.innerHeight / 2;
      }
    }

    /*
      Keep this camera function simple.
      This button click creates the actual browser
      camera permission request.
    */
    async function startCamera() {
      const stream =
      await navigator.mediaDevices.getUserMedia({
        video: true,
        audio: false
      });

      video.srcObject = stream;

      await video.play();
    }

    /*
      Pose tracking is optional to game startup.
      The game begins whether this succeeds or fails.
    */
    async function loadPoseTracking() {
      try {
        const vision =
        await FilesetResolver.forVisionTasks(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"
        );

        poseLandmarker =
        await PoseLandmarker.createFromOptions(
          vision,
          {
            baseOptions: {
              modelAssetPath:
                "https://storage.googleapis.com/mediapipe-models/" +
                "pose_landmarker/pose_landmarker_lite/float16/1/" +
                "pose_landmarker_lite.task",
              delegate: "CPU"
            },
            runningMode: "VIDEO",
            numPoses: 1
          }
        );

        info.textContent =
        "Game active. Looking for player.";

      } catch (error) {
        console.error(error);

        info.textContent =
        "Game active. Tracker did not load; yellow zone stays centered.";
      }
    }

    /*
      This does not stop the game if no pose is found.
      It only changes whether the hit zone follows a person.
    */
    function updatePersonZone(timestamp) {
      if (
        !poseLandmarker ||
        video.readyState < HTMLMediaElement.HAVE_CURRENT_DATA
      ) {
        return;
      }

      if (video.currentTime === lastVideoTime) {
        return;
      }

      lastVideoTime = video.currentTime;

      const result =
      poseLandmarker.detectForVideo(
        video,
        timestamp
      );

      if (!result.landmarks?.length) {
        player.tracked = false;
        return;
      }

      const points = result.landmarks[0];

      const nose = points[0];
      const leftShoulder = points[11];
      const rightShoulder = points[12];
      const leftHip = points[23];
      const rightHip = points[24];

      if (!nose || !leftShoulder || !rightShoulder) {
        player.tracked = false;
        return;
      }

      const shoulderCenterX =
      (leftShoulder.x + rightShoulder.x) / 2;

      const shoulderCenterY =
      (leftShoulder.y + rightShoulder.y) / 2;

      const shoulderWidth =
      Math.hypot(
        rightShoulder.x - leftShoulder.x,
        rightShoulder.y - leftShoulder.y
      );

      /*
        Camera is visually mirrored.
        Invert X so Canvas follows the mirrored body.
      */
      const targetX =
      (1 - nose.x) * window.innerWidth;

      const targetY =
      nose.y * window.innerHeight;

      /*
        Use shoulder width to create a person-sized
        upper-body light border / hit zone.
      */
      const widthPixels =
      shoulderWidth * window.innerWidth;

      player.x = targetX;
      player.y = targetY;

      player.radiusX =
      Math.max(55, widthPixels * 0.62);

      player.radiusY =
      Math.max(80, widthPixels * 0.98);

      player.tracked = true;
    }

    function spawnProjectile() {
      const fromLeft =
      Math.random() > 0.5;

      const startX =
      fromLeft ? -60 : window.innerWidth + 60;

      const startY =
      80 +
      Math.random() *
      Math.max(80, window.innerHeight - 160);

      /*
        Lock to the current yellow or green hit zone.
        The game works either way.
      */
      const targetX = player.x;
      const targetY = player.y;

      const dx = targetX - startX;
      const dy = targetY - startY;
      const length = Math.hypot(dx, dy) || 1;
      const speed = 500;

      projectile = {
        x: startX,
        y: startY,
        vx: (dx / length) * speed,
        vy: (dy / length) * speed,
        targetX,
        targetY,
        radius: 16,
        createdAt: performance.now(),
        warningTime: 700,
        fired: false
      };
    }

    function circleHitsZone(circle, zone) {
      const radiusX =
      zone.radiusX + circle.radius;

      const radiusY =
      zone.radiusY + circle.radius;

      const dx = circle.x - zone.x;
      const dy = circle.y - zone.y;

      const result =
      (dx * dx) / (radiusX * radiusX) +
      (dy * dy) / (radiusY * radiusY);

      return result <= 1;
    }

    function projectileOut() {
      const padding = 110;

      return (
        projectile.x < -padding ||
        projectile.x > window.innerWidth + padding ||
        projectile.y < -padding ||
        projectile.y > window.innerHeight + padding
      );
    }

    function updateProjectile(timestamp, deltaMs) {
      if (!projectile) {
        if (timestamp - lastSpawnTime > 1300) {
          spawnProjectile();
          lastSpawnTime = timestamp;
        }

        return;
      }

      if (!projectile.fired) {
        if (
          timestamp - projectile.createdAt >=
          projectile.warningTime
        ) {
          projectile.fired = true;
        }

        return;
      }

      const dt = deltaMs / 1000;

      projectile.x += projectile.vx * dt;
      projectile.y += projectile.vy * dt;

      if (circleHitsZone(projectile, player)) {
        health -= 1;
        projectile = null;

        if (health <= 0) {
          running = false;

          info.textContent =
          `Game Over | Score: ${score}`;

          startButton.textContent =
          "Restart Game";

          startButton.classList.remove("hidden");
        }

        return;
      }

      if (projectile && projectileOut()) {
        score += 1;
        projectile = null;
      }
    }

    /*
      Draw the role-play light border.

      Yellow = no player detected:
      game still runs, target zone stays center.

      Green = person detected:
      border follows the tracked person and acts
      as the real hit zone.
    */
    function drawPlayerZone() {
      const color =
      player.tracked ? "#52ffb7" : "#ffe66d";

      const label =
      player.tracked
        ? "PLAYER HIT ZONE"
        : "DEFAULT HIT ZONE";

      ctx.save();

      ctx.fillStyle =
      player.tracked
        ? "rgba(82,255,183,0.10)"
        : "rgba(255,230,109,0.10)";

      ctx.strokeStyle = color;
      ctx.lineWidth = 4;

      ctx.beginPath();

      ctx.ellipse(
        player.x,
        player.y,
        player.radiusX,
        player.radiusY,
        0,
        0,
        Math.PI * 2
      );

      ctx.fill();
      ctx.stroke();

      /*
        Small center light.
      */
      ctx.fillStyle = color;

      ctx.beginPath();

      ctx.arc(
        player.x,
        player.y,
        8,
        0,
        Math.PI * 2
      );

      ctx.fill();

      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 12px Arial";
      ctx.textAlign = "center";

      ctx.fillText(
        label,
        player.x,
        player.y - player.radiusY - 14
      );

      ctx.restore();
    }

    function drawProjectile() {
      if (!projectile) return;

      if (!projectile.fired) {
        ctx.save();

        ctx.strokeStyle = "#ffdf5c";
        ctx.lineWidth = 2;
        ctx.setLineDash([8, 7]);

        ctx.beginPath();

        ctx.moveTo(
          projectile.x,
          projectile.y
        );

        ctx.lineTo(
          projectile.targetX,
          projectile.targetY
        );

        ctx.stroke();

        ctx.setLineDash([]);

        ctx.beginPath();

        ctx.arc(
          projectile.targetX,
          projectile.targetY,
          24,
          0,
          Math.PI * 2
        );

        ctx.stroke();

        ctx.restore();
        return;
      }

      ctx.save();

      ctx.fillStyle = "#51e5ff";

      ctx.beginPath();

      ctx.arc(
        projectile.x,
        projectile.y,
        projectile.radius,
        0,
        Math.PI * 2
      );

      ctx.fill();

      ctx.strokeStyle = "#e2ffff";
      ctx.lineWidth = 2;

      ctx.beginPath();

      ctx.arc(
        projectile.x,
        projectile.y,
        projectile.radius + 4,
        0,
        Math.PI * 2
      );

      ctx.stroke();

      ctx.restore();
    }

    function draw() {
      ctx.clearRect(
        0,
        0,
        window.innerWidth,
        window.innerHeight
      );

      drawPlayerZone();
      drawProjectile();
    }

    function updateInfo() {
      const zoneState =
      player.tracked
        ? "Green: player tracked"
        : "Yellow: game active";

      info.textContent =
      `Score: ${score} | Health: ${health} | ${zoneState}`;
    }

    function loop(timestamp) {
      if (!running) return;

      const last =
      loop.lastTime || timestamp;

      const deltaMs = Math.min(
        timestamp - last,
        50
      );

      loop.lastTime = timestamp;

      updatePersonZone(timestamp);

      /*
        Projectiles keep spawning and moving even
        when player.tracked is false / yellow.
      */
      updateProjectile(timestamp, deltaMs);

      draw();
      updateInfo();

      requestAnimationFrame(loop);
    }

    async function startGame() {
      try {
        startButton.disabled = true;
        startButton.textContent =
        "Starting Camera...";

        /*
          Native browser permission prompt.
          Camera turns on before tracking logic.
        */
        await startCamera();

        /*
          Game starts immediately.
        */
        score = 0;
        health = 3;
        projectile = null;
        lastSpawnTime = performance.now();

        player.x = window.innerWidth / 2;
        player.y = window.innerHeight / 2;
        player.radiusX = 75;
        player.radiusY = 100;
        player.tracked = false;

        running = true;

        startButton.classList.add("hidden");

        info.textContent =
        "Game active. Yellow zone is active until player tracking begins.";

        if (!animationStarted) {
          animationStarted = true;
          requestAnimationFrame(loop);
        }

        /*
          Tracker loads separately.
          Its success is not required for the game loop.
        */
        loadPoseTracking();

      } catch (error) {
        console.error(error);

        info.textContent =
        `Camera error: ${error.name || ""} ${error.message || ""}`;

        startButton.disabled = false;
        startButton.textContent =
        "Try Camera Again";
      }
    }

    startButton.addEventListener(
      "click",
      startGame
    );

    window.addEventListener(
      "resize",
      resizeCanvas
    );

    window.addEventListener(
      "beforeunload",
      () => {
        const stream = video.srcObject;

        if (stream) {
          stream.getTracks().forEach(
            (track) => track.stop()
          );
        }
      }
    );

    resizeCanvas();
  </script>
</body>
</html>
