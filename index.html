<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

resize();

window.addEventListener("resize", resize);

let score = 0;
let combo = 0;
let health = 100;
let level = 1;

let mode = "avoid";

const hand = {
  x: canvas.width / 2,
  y: canvas.height / 2
};

const threat = {
  x: canvas.width,
  y: canvas.height / 2,
  speed: 8,
  radius: 30
};

const counterTarget = {
  active: false,
  x: 0,
  y: 0,
  radius: 40
};

function distance(x1, y1, x2, y2) {
  return Math.hypot(x1 - x2, y1 - y2);
}

function randomMode() {
  const modes = [
    "avoid",
    "deflect",
    "counter"
  ];

  mode =
    modes[
      Math.floor(
        Math.random() * modes.length
      )
    ];

  threat.x = canvas.width + 120;
  threat.y = Math.random() * canvas.height;

  counterTarget.active = false;

  threat.speed =
    8 + level * 0.5;
}

function failAction() {
  combo = 0;
  health -= 10;

  if (health <= 0) {
    gameOver();
  }

  randomMode();
}

function success(points) {
  combo++;

  const bonus =
    Math.floor(combo / 5) * 5;

  score += points + bonus;

  level =
    1 + Math.floor(score / 100);

  randomMode();
}

let running = true;

function gameOver() {
  running = false;
}

function update() {

  if (!running) return;

  threat.x -= threat.speed;

  const d = distance(
    hand.x,
    hand.y,
    threat.x,
    threat.y
  );

  if (mode === "avoid") {

    if (
      threat.x <
      canvas.width * 0.25
    ) {
      if (d > 150) {
        success(10);
      } else {
        failAction();
      }
    }

    if (threat.x < -100) {
      success(10);
    }
  }

  if (mode === "deflect") {

    if (d < 60) {
      success(15);
    }

    if (threat.x < -100) {
      failAction();
    }
  }

  if (mode === "counter") {

    if (
      !counterTarget.active &&
      d < 60
    ) {
      counterTarget.active = true;

      counterTarget.x =
        Math.random() *
        canvas.width;

      counterTarget.y =
        Math.random() *
        canvas.height;
    }

    if (
      counterTarget.active
    ) {

      const cd = distance(
        hand.x,
        hand.y,
        counterTarget.x,
        counterTarget.y
      );

      if (
        cd <
        counterTarget.radius
      ) {
        success(30);
      }
    }

    if (threat.x < -100) {
      failAction();
    }
  }
}

function drawBackground() {

  const gradient =
    ctx.createLinearGradient(
      0,
      0,
      0,
      canvas.height
    );

  gradient.addColorStop(
    0,
    "#071220"
  );

  gradient.addColorStop(
    1,
    "#01070f"
  );

  ctx.fillStyle = gradient;

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );
}

function drawThreat() {

  const glow =
    ctx.createRadialGradient(
      threat.x,
      threat.y,
      5,
      threat.x,
      threat.y,
      70
    );

  glow.addColorStop(
    0,
    "#ffffff"
  );

  glow.addColorStop(
    0.3,
    "#ff4444"
  );

  glow.addColorStop(
    1,
    "rgba(255,0,0,0)"
  );

  ctx.fillStyle = glow;

  ctx.beginPath();
  ctx.arc(
    threat.x,
    threat.y,
    70,
    0,
    Math.PI * 2
  );
  ctx.fill();

  ctx.fillStyle = "#ff3333";

  ctx.beginPath();
  ctx.arc(
    threat.x,
    threat.y,
    threat.radius,
    0,
    Math.PI * 2
  );

  ctx.fill();
}

function drawHand() {

  ctx.fillStyle = "#20e4ff";

  ctx.beginPath();
  ctx.arc(
    hand.x,
    hand.y,
    22,
    0,
    Math.PI * 2
  );

  ctx.fill();

  ctx.strokeStyle = "#ffffff";
  ctx.lineWidth = 2;

  ctx.stroke();
}

function drawCounterTarget() {

  if (
    !counterTarget.active
  ) return;

  ctx.strokeStyle =
    "#00ff88";

  ctx.lineWidth = 4;

  ctx.beginPath();

  ctx.arc(
    counterTarget.x,
    counterTarget.y,
    counterTarget.radius,
    0,
    Math.PI * 2
  );

  ctx.stroke();
}

function drawHUD() {

  ctx.fillStyle =
    "rgba(0,0,0,0.5)";

  ctx.fillRect(
    10,
    10,
    320,
    140
  );

  ctx.fillStyle = "white";

  ctx.font =
    "24px Arial";

  ctx.fillText(
    "Score: " + score,
    20,
    40
  );

  ctx.fillText(
    "Combo: " + combo,
    20,
    75
  );

  ctx.fillText(
    "Level: " + level,
    20,
    110
  );

  ctx.fillText(
    "Mode: " +
      mode.toUpperCase(),
    20,
    145
  );

  ctx.fillStyle =
    health > 30
      ? "#00ff88"
      : "#ff4444";

  ctx.fillRect(
    350,
    20,
    health * 2,
    25
  );

  ctx.strokeStyle =
    "white";

  ctx.strokeRect(
    350,
    20,
    200,
    25
  );
}

function drawGameOver() {

  ctx.fillStyle =
    "rgba(0,0,0,0.75)";

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  ctx.fillStyle = "#ffffff";

  ctx.textAlign =
    "center";

  ctx.font =
    "bold 60px Arial";

  ctx.fillText(
    "GAME OVER",
    canvas.width / 2,
    canvas.height / 2
  );

  ctx.font =
    "24px Arial";

  ctx.fillText(
    "Final Score: " +
      score,
    canvas.width / 2,
    canvas.height / 2 + 60
  );
}

function draw() {

  drawBackground();

  drawThreat();

  drawHand();

  drawCounterTarget();

  drawHUD();

  if (!running) {
    drawGameOver();
  }
}

function loop() {

  update();

  draw();

  requestAnimationFrame(
    loop
  );
}

window.addEventListener(
  "mousemove",
  (e) => {
    hand.x = e.clientX;
    hand.y = e.clientY;
  }
);

randomMode();

loop();
</script>
