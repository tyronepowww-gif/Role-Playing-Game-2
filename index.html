<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no"
  />
  <meta name="theme-color" content="#05070b" />
  <title>Laser Dodge</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #05070b;
      font-family: Arial, Helvetica, sans-serif;
    }

    #app,
    #video,
    #canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #app {
      overflow: hidden;
      background: #05070b;
    }

    #video {
      z-index: 1;
      object-fit: cover;
      transform: scaleX(-1);
      opacity: 0.42;
      background: #000;
    }

    #canvas {
      z-index: 2;
      pointer-events: none;
    }

    #hud {
      position: fixed;
      z-index: 5;
      top: 12px;
      left: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      max-width: calc(100vw - 24px);
      color: #ffffff;
      font-size: 14px;
    }

    .hud-item {
      padding: 9px 11px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 9px;
      background: rgba(0, 0, 0, 0.72);
      line-height: 1.2;
    }

    #status {
      color: #dbe7ff;
    }

    #permission-panel {
      position: fixed;
      z-index: 10;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(
          circle at center,
          rgba(54, 18, 39, 0.46),
          rgba(0, 0, 0, 0.92) 68%
        );
    }

    #permission-card {
      width: min(440px, 100%);
      padding: 24px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 16px;
      background: rgba(11, 12, 18, 0.96);
      color: #ffffff;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.55);
    }

    #permission-card h1 {
      margin: 0 0 12px;
      font-size: 26px;
    }

    #permission-card p {
      margin: 0 0 18px;
      color: #d3d8e5;
      font-size: 15px;
      line-height: 1.55;
    }

    #camera-permission {
      min-width: 190px;
      padding: 13px 18px;
      border: 0;
      border-radius: 10px;
      background: #73f5ff;
      color: #001018;
      cursor: pointer;
      font-size: 16px;
      font-weight: 700;
    }

    #camera-permission:hover {
      background: #a3f9ff;
    }

    #camera-permission:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>
  <main id="app">
    <video id="video" autoplay muted playsinline></video>
    <canvas id="canvas"></canvas>

    <div id="hud">
      <div class="hud-item" id="score-display">Score: 0</div>
      <div class="hud-item" id="health-display">Health: 3</div>
      <div class="hud-item" id="status">
        Camera permission required
      </div>
    </div>

    <section id="permission-panel" aria-live="polite">
      <div id="permission-card">
        <h1>Laser Dodge</h1>

        <p id="permission-message">
          Allow camera access. The game starts when it detects a clear person
          separated from the background.
        </p>

        <button id="camera-permission" type="button">
          Allow Camera
        </button>
      </div>
    </section>
  </main>

  <!-- TensorFlow.js runtime and GPU/WebGL backend -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core@4.22.0/dist/tf-core.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl@4.22.0/dist/tf-backend-webgl.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter@4.22.0/dist/tf-converter.min.js"></script>

  <!-- TensorFlow.js body/person segmentation model package -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/body-segmentation@1.0.2/dist/body-segmentation.min.js"></script>

  <script>
    (() => {
      const video = document.getElementById("video");
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");

      const scoreDisplay = document.getElementById("score-display");
      const healthDisplay = document.getElementById("health-display");
      const statusDisplay = document.getElementById("status");

      const permissionPanel =
        document.getElementById("permission-panel");

      const permissionMessage =
        document.getElementById("permission-message");

      const permissionButton =
        document.getElementById("camera-permission");

      /*
        The low-resolution, green body mask lives here.
        It is not visible in the HTML directly; the main canvas draws it.
      */
      const maskCanvas = document.createElement("canvas");
      const maskCtx = maskCanvas.getContext(
        "2d",
        { willReadFrequently: true }
      );

      let mediaStream = null;
      let segmenter = null;
      let segmenterLoading = false;

      let segmentationBusy = false;
      let lastSegmentationAt = 0;

      let running = false;
      let playing = false;
      let gameOver = false;

      let score = 0;
      let health = 3;

      let laser = null;
      let lastLaserEndedAt = 0;

      /*
        Segmentation runs about 13 times per second. Drawing remains
        smooth through requestAnimationFrame.
      */
      const segmentationIntervalMs = 75;

      /*
        Alpha threshold from the person/background mask.
        Raise it if background is included in the player mask.
        Lower it if the mask loses too much of the player.
      */
      const personAlphaThreshold = 145;

      /*
        A valid human mask must cover at least this fraction of the
        segmentation frame. This prevents tiny/noisy regions from
        triggering the start of the game.
      */
      const minBodyAreaRatio = 0.018;

      /*
        The mask needs to remain valid for this many inference frames
        before the first laser can spawn.
      */
      const requiredStableFrames = 7;

      /*
        Keep the most recent valid body mask briefly when an individual
        TensorFlow inference frame is weak; after this time, all laser
        activity pauses and collisions turn off.
      */
      const trackingGraceMs = 800;

      let stableFrames = 0;

      const player = {
        tracked: false,
        lastTrackedAt: 0,

        /*
          Binary mask: 255 means body, 0 means background.
        */
        pixels: null,

        width: 0,
        height: 0,

        activePixelCount: 0
      };

      function resizeCanvas() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);

        canvas.width = Math.floor(window.innerWidth * dpr);
        canvas.height = Math.floor(window.innerHeight * dpr);

        canvas.style.width = `${window.innerWidth}px`;
        canvas.style.height = `${window.innerHeight}px`;

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function clearPlayerMask() {
        player.tracked = false;
        player.pixels = null;
        player.width = 0;
        player.height = 0;
        player.activePixelCount = 0;

        maskCanvas.width = 1;
        maskCanvas.height = 1;
      }

      function resetGame() {
        score = 0;
        health = 3;
        laser = null;

        lastLaserEndedAt = performance.now();
        lastSegmentationAt = 0;

        stableFrames = 0;
        playing = false;
        gameOver = false;

        player.lastTrackedAt = 0;

        clearPlayerMask();
        updateHud();
      }

      function updateHud() {
        scoreDisplay.textContent = `Score: ${score}`;
        healthDisplay.textContent = `Health: ${health}`;

        if (gameOver) {
          statusDisplay.textContent =
            "Game over — refresh the page to play again.";
          return;
        }

        if (!segmenter) {
          statusDisplay.textContent =
            "Loading person detection…";
          return;
        }

        if (!player.tracked) {
          statusDisplay.textContent =
            "Looking for a person — lasers inactive.";
          return;
        }

        if (!playing) {
          statusDisplay.textContent =
            `Person detected — stabilizing ${stableFrames}/${requiredStableFrames}`;
          return;
        }

        statusDisplay.textContent =
          "Person tracked — dodge the red laser.";
      }

      function showCameraError(error) {
        console.error("Camera error:", error);

        permissionButton.disabled = false;
        permissionButton.textContent = "Try Camera Again";

        let message = "";

        if (!window.isSecureContext) {
          message =
            "Camera access requires HTTPS. Open your GitHub Pages link, not a local file or an HTTP address.";
        } else if (!navigator.mediaDevices?.getUserMedia) {
          message =
            "This browser does not support camera access.";
        } else if (error?.name === "NotAllowedError") {
          message =
            "Camera permission was blocked. Use the browser camera or lock icon in the address bar, allow access for this site, then try again.";
        } else if (error?.name === "NotFoundError") {
          message =
            "No usable camera was found on this device.";
        } else if (error?.name === "NotReadableError") {
          message =
            "The camera is busy in another app or browser tab.";
        } else {
          message =
            `Camera could not start: ${
              error?.message || error?.name || "Unknown error"
            }`;
        }

        permissionMessage.textContent = message;
        statusDisplay.textContent = "Camera access was not granted.";
      }

      async function enableCamera(event) {
        event.preventDefault();

        if (mediaStream) {
          permissionPanel.classList.add("hidden");
          return;
        }

        if (!window.isSecureContext) {
          showCameraError(
            new Error("This page is not running in a secure context.")
          );
          return;
        }

        if (!navigator.mediaDevices?.getUserMedia) {
          showCameraError(
            new Error("navigator.mediaDevices.getUserMedia is unavailable.")
          );
          return;
        }

        try {
          permissionButton.disabled = true;
          permissionButton.textContent = "Requesting Access…";

          permissionMessage.textContent =
            "Your browser should now display its camera permission dialog.";

          /*
            This must occur directly from the user click path.
          */
          mediaStream = await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: false
          });

          video.srcObject = mediaStream;
          await video.play();

          resetGame();

          permissionPanel.classList.add("hidden");

          statusDisplay.textContent =
            "Camera active. Loading TensorFlow person detection…";

          running = true;
          requestAnimationFrame(loop);

          loadSegmenter();

        } catch (error) {
          showCameraError(error);
        }
      }

      async function loadSegmenter() {
        if (segmenter || segmenterLoading) {
          return;
        }

        segmenterLoading = true;

        try {
          if (!window.tf || !window.bodySegmentation) {
            throw new Error(
              "TensorFlow.js libraries did not load. Check your connection and reload."
            );
          }

          await tf.setBackend("webgl");
          await tf.ready();

          const model =
            bodySegmentation.SupportedModels
              .MediaPipeSelfieSegmentation;

          /*
            TensorFlow.js runs the model. "general" is used because
            it is the better choice when more of the player is visible.
          */
          segmenter =
            await bodySegmentation.createSegmenter(
              model,
              {
                runtime: "tfjs",
                modelType: "general"
              }
            );

          updateHud();

        } catch (error) {
          console.error("Person segmentation error:", error);

          statusDisplay.textContent =
            "Camera active, but person detection could not load.";

        } finally {
          segmenterLoading = false;
        }
      }

      /*
        Converts segmentation-mask image data into:
        - A horizontally mirrored binary mask for accurate collisions.
        - A translucent green RGBA mask for visual feedback.
        - A simple count of body pixels for the start criterion.
      */
      function updatePlayerMask(maskImageData) {
        const sourceWidth = maskImageData.width;
        const sourceHeight = maskImageData.height;

        if (!sourceWidth || !sourceHeight) {
          clearPlayerMask();
          return false;
        }

        const sourcePixels = maskImageData.data;

        const binary = new Uint8Array(
          sourceWidth * sourceHeight
        );

        const greenMask = new Uint8ClampedArray(
          sourceWidth * sourceHeight * 4
        );

        let activePixelCount = 0;

        for (let y = 0; y < sourceHeight; y += 1) {
          for (let x = 0; x < sourceWidth; x += 1) {
            const sourceIndex =
              y * sourceWidth + x;

            const sourceRgbaIndex =
              sourceIndex * 4;

            /*
              Person/background confidence comes through alpha.
            */
            const alpha =
              sourcePixels[sourceRgbaIndex + 3];

            if (alpha < personAlphaThreshold) {
              continue;
            }

            /*
              Video is mirrored in CSS. Mirror the model mask before
              drawing or testing collision so screen positions match.
            */
            const mirroredX =
              sourceWidth - 1 - x;

            const targetIndex =
              y * sourceWidth + mirroredX;

            const targetRgbaIndex =
              targetIndex * 4;

            binary[targetIndex] = 255;

            greenMask[targetRgbaIndex] = 75;
            greenMask[targetRgbaIndex + 1] = 255;
            greenMask[targetRgbaIndex + 2] = 180;
            greenMask[targetRgbaIndex + 3] = 125;

            activePixelCount += 1;
          }
        }

        const totalPixels =
          sourceWidth * sourceHeight;

        const bodyAreaRatio =
          activePixelCount / totalPixels;

        /*
          This is the entire person-present test.
          No pose landmarks or face detection are involved.
        */
        if (
          activePixelCount === 0 ||
          bodyAreaRatio < minBodyAreaRatio
        ) {
          clearPlayerMask();
          return false;
        }

        maskCanvas.width = sourceWidth;
        maskCanvas.height = sourceHeight;

        maskCtx.putImageData(
          new ImageData(
            greenMask,
            sourceWidth,
            sourceHeight
          ),
          0,
          0
        );

        player.pixels = binary;
        player.width = sourceWidth;
        player.height = sourceHeight;
        player.activePixelCount = activePixelCount;
        player.tracked = true;

        return true;
      }

      async function updateSegmentation(timestamp) {
        if (
          !segmenter ||
          segmentationBusy ||
          video.readyState <
            HTMLMediaElement.HAVE_CURRENT_DATA
        ) {
          return;
        }

        if (
          timestamp - lastSegmentationAt <
          segmentationIntervalMs
        ) {
          return;
        }

        segmentationBusy = true;
        lastSegmentationAt = timestamp;

        try {
          const people =
            await segmenter.segmentPeople(
              video,
              {
                flipHorizontal: false,
                multiSegmentation: false,
                segmentBodyParts: false
              }
            );

          const person = people?.[0];

          if (!person?.mask) {
            stableFrames = 0;

            if (
              timestamp - player.lastTrackedAt >
              trackingGraceMs
            ) {
              clearPlayerMask();
            }

            return;
          }

          /*
            Converts the person/background segmentation to ImageData.
          */
          const maskImageData =
            await person.mask.toImageData();

          const personVisible =
            updatePlayerMask(maskImageData);

          if (!personVisible) {
            stableFrames = 0;

            if (
              timestamp - player.lastTrackedAt >
              trackingGraceMs
            ) {
              clearPlayerMask();
            }

            return;
          }

          player.lastTrackedAt = timestamp;

          if (!playing) {
            stableFrames += 1;

            if (
              stableFrames >=
              requiredStableFrames
            ) {
              playing = true;
              lastLaserEndedAt = timestamp;
            }
          }

        } catch (error) {
          console.warn(
            "Person segmentation frame failed:",
            error
          );

        } finally {
          segmentationBusy = false;
        }
      }

      function spawnLaser(timestamp) {
        if (!playing || !player.tracked) {
          return;
        }

        const orientation =
          Math.random() > 0.5
            ? "horizontal"
            : "vertical";

        const linePosition =
          orientation === "horizontal"
            ? 70 +
              Math.random() *
              Math.max(
                80,
                window.innerHeight - 140
              )
            : 70 +
              Math.random() *
              Math.max(
                80,
                window.innerWidth - 140
              );

        laser = {
          orientation,
          linePosition,
          createdAt: timestamp,
          warningTime: 850,
          activeTime: 950,
          thickness: 20,
          active: false,
          damageApplied: false
        };
      }

      function updateLaser(timestamp) {
        /*
          No tracked silhouette = no lasers and no collision damage.
        */
        if (!playing || !player.tracked) {
          return;
        }

        if (!laser) {
          if (timestamp - lastLaserEndedAt > 1100) {
            spawnLaser(timestamp);
          }

          return;
        }

        const elapsed =
          timestamp - laser.createdAt;

        if (
          !laser.active &&
          elapsed >= laser.warningTime
        ) {
          laser.active = true;
        }

        if (
          laser.active &&
          !laser.damageApplied &&
          laserHitsPlayer(laser)
        ) {
          laser.damageApplied = true;
          health -= 1;

          if (health <= 0) {
            running = false;
            gameOver = true;
            updateHud();
            return;
          }
        }

        if (
          elapsed >=
          laser.warningTime + laser.activeTime
        ) {
          if (!laser.damageApplied) {
            score += 1;
          }

          laser = null;
          lastLaserEndedAt = timestamp;
        }
      }

      function bodyMaskContainsScreenPoint(
        screenX,
        screenY
      ) {
        if (
          !player.tracked ||
          !player.pixels ||
          player.width <= 0 ||
          player.height <= 0
        ) {
          return false;
        }

        const maskX = Math.floor(
          (screenX / window.innerWidth) *
          player.width
        );

        const maskY = Math.floor(
          (screenY / window.innerHeight) *
          player.height
        );

        if (
          maskX < 0 ||
          maskX >= player.width ||
          maskY < 0 ||
          maskY >= player.height
        ) {
          return false;
        }

        return (
          player.pixels[
            maskY * player.width + maskX
          ] === 255
        );
      }

      /*
        Test active-laser samples against real body-mask pixels.
      */
      function laserHitsPlayer(laserObject) {
        if (!player.tracked || !player.pixels) {
          return false;
        }

        const sampleStep = 7;
        const halfThickness =
          laserObject.thickness / 2;

        if (
          laserObject.orientation ===
          "horizontal"
        ) {
          const y = laserObject.linePosition;

          for (
            let x = 0;
            x < window.innerWidth;
            x += sampleStep
          ) {
            for (
              let offset = -halfThickness;
              offset <= halfThickness;
              offset += 6
            ) {
              if (
                bodyMaskContainsScreenPoint(
                  x,
                  y + offset
                )
              ) {
                return true;
              }
            }
          }

          return false;
        }

        const x = laserObject.linePosition;

        for (
          let y = 0;
          y < window.innerHeight;
          y += sampleStep
        ) {
          for (
            let offset = -halfThickness;
            offset <= halfThickness;
            offset += 6
          ) {
            if (
              bodyMaskContainsScreenPoint(
                x + offset,
                y
              )
            ) {
              return true;
            }
          }
        }

        return false;
      }

      function drawBodyMask() {
        if (!player.tracked || !player.pixels) {
          return;
        }

        ctx.save();

        ctx.globalAlpha = 0.78;
        ctx.imageSmoothingEnabled = true;

        ctx.drawImage(
          maskCanvas,
          0,
          0,
          player.width,
          player.height,
          0,
          0,
          window.innerWidth,
          window.innerHeight
        );

        ctx.restore();
      }

      function drawLaser() {
        if (!laser) {
          return;
        }

        const elapsed =
          performance.now() - laser.createdAt;

        const warning = !laser.active;

        const warningProgress = warning
          ? Math.min(
              1,
              elapsed / laser.warningTime
            )
          : 1;

        const pulse =
          0.62 +
          Math.sin(performance.now() / 75) * 0.25;

        ctx.save();

        if (
          laser.orientation ===
          "horizontal"
        ) {
          const y = laser.linePosition;

          if (warning) {
            ctx.strokeStyle =
              `rgba(255, 88, 88, ${
                0.30 + warningProgress * 0.40
              })`;

            ctx.lineWidth = 3;
            ctx.setLineDash([10, 9]);

            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(window.innerWidth, y);
            ctx.stroke();

            ctx.setLineDash([]);

            ctx.fillStyle = "#ffe1dc";
            ctx.font = "bold 13px Arial";
            ctx.textAlign = "center";

            ctx.fillText(
              "LASER LOCKING",
              window.innerWidth / 2,
              Math.max(24, y - 16)
            );

          } else {
            ctx.strokeStyle =
              `rgba(255, 24, 48, ${pulse})`;

            ctx.lineWidth =
              laser.thickness + 16;

            ctx.shadowColor = "#ff1732";
            ctx.shadowBlur = 28;

            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(window.innerWidth, y);
            ctx.stroke();

            ctx.shadowBlur = 0;
            ctx.strokeStyle = "#fff2f2";
            ctx.lineWidth = 3;

            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(window.innerWidth, y);
            ctx.stroke();
          }

        } else {
          const x = laser.linePosition;

          if (warning) {
            ctx.strokeStyle =
              `rgba(255, 88, 88, ${
                0.30 + warningProgress * 0.40
              })`;

            ctx.lineWidth = 3;
            ctx.setLineDash([10, 9]);

            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, window.innerHeight);
            ctx.stroke();

            ctx.setLineDash([]);

            ctx.save();

            ctx.translate(
              x - 15,
              window.innerHeight / 2
            );

            ctx.rotate(-Math.PI / 2);

            ctx.fillStyle = "#ffe1dc";
            ctx.font = "bold 13px Arial";
            ctx.textAlign = "center";

            ctx.fillText(
              "LASER LOCKING",
              0,
              0
            );

            ctx.restore();

          } else {
            ctx.strokeStyle =
              `rgba(255, 24, 48, ${pulse})`;

            ctx.lineWidth =
              laser.thickness + 16;

            ctx.shadowColor = "#ff1732";
            ctx.shadowBlur = 28;

            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, window.innerHeight);
            ctx.stroke();

            ctx.shadowBlur = 0;
            ctx.strokeStyle = "#fff2f2";
            ctx.lineWidth = 3;

            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, window.innerHeight);
            ctx.stroke();
          }
        }

        ctx.restore();
      }

      function drawWaitingOverlay() {
        if (playing || gameOver) {
          return;
        }

        ctx.save();

        ctx.fillStyle = "rgba(0, 0, 0, 0.48)";

        ctx.fillRect(
          0,
          window.innerHeight - 70,
          window.innerWidth,
          70
        );

        ctx.fillStyle = "#ffe66d";
        ctx.font = "bold 16px Arial";
        ctx.textAlign = "center";

        let message =
          "LOADING TENSORFLOW PERSON DETECTION…";

        if (segmenter && !player.tracked) {
          message =
            "STEP INTO VIEW — LASERS ARE OFF";
        }

        if (segmenter && player.tracked) {
          message =
            "PERSON DETECTED — HOLD FOR TRACKING CONFIRMATION";
        }

        ctx.fillText(
          message,
          window.innerWidth / 2,
          window.innerHeight - 30
        );

        ctx.restore();
      }

      function drawGameOver() {
        if (!gameOver) {
          return;
        }

        ctx.save();

        ctx.fillStyle = "rgba(0, 0, 0, 0.72)";

        ctx.fillRect(
          0,
          0,
          window.innerWidth,
          window.innerHeight
        );

        ctx.fillStyle = "#ff6875";
        ctx.font = "bold 34px Arial";
        ctx.textAlign = "center";

        ctx.fillText(
          "GAME OVER",
          window.innerWidth / 2,
          window.innerHeight / 2 - 20
        );

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 18px Arial";

        ctx.fillText(
          `Final score: ${score}`,
          window.innerWidth / 2,
          window.innerHeight / 2 + 20
        );

        ctx.font = "15px Arial";

        ctx.fillText(
          "Refresh the page to play again",
          window.innerWidth / 2,
          window.innerHeight / 2 + 54
        );

        ctx.restore();
      }

      function draw() {
        ctx.clearRect(
          0,
          0,
          window.innerWidth,
          window.innerHeight
        );

        drawBodyMask();
        drawLaser();
        drawWaitingOverlay();
        drawGameOver();
      }

      function loop(timestamp) {
        if (!running) {
          return;
        }

        updateSegmentation(timestamp);
        updateLaser(timestamp);

        draw();
        updateHud();

        requestAnimationFrame(loop);
      }

      permissionButton.addEventListener(
        "click",
        enableCamera
      );

      window.addEventListener(
        "resize",
        resizeCanvas
      );

      window.addEventListener(
        "pagehide",
        () => {
          if (mediaStream) {
            mediaStream.getTracks().forEach(
              (track) => track.stop()
            );
          }

          if (
            segmenter &&
            typeof segmenter.dispose === "function"
          ) {
            segmenter.dispose();
          }
        }
      );

      resizeCanvas();
      updateHud();
    })();
  </script>
</body>
</html>
