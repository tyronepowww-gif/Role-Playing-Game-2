<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no"
  />
  <meta name="theme-color" content="#05070b" />
  <title>Laser Dodge</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #05070b;
      font-family: Arial, Helvetica, sans-serif;
    }

    #video,
    #canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
    }

    #video {
      z-index: 1;
      object-fit: cover;
      transform: scaleX(-1);
      opacity: 0.42;
      background: #000;
    }

    #canvas {
      z-index: 2;
      pointer-events: none;
    }

    #hud {
      position: fixed;
      z-index: 5;
      top: 12px;
      left: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      max-width: calc(100vw - 24px);
      color: white;
      font-size: 14px;
    }

    .hud-item {
      padding: 9px 11px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 9px;
      background: rgba(0, 0, 0, 0.72);
    }

    #permission-panel {
      position: fixed;
      z-index: 10;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(0, 0, 0, 0.88);
    }

    #permission-card {
      width: min(420px, 100%);
      padding: 24px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 16px;
      background: #11131a;
      color: white;
      text-align: center;
    }

    #permission-card h1 {
      margin: 0 0 12px;
      font-size: 26px;
    }

    #permission-card p {
      margin: 0 0 18px;
      color: #d4d8e2;
      line-height: 1.5;
    }

    #allow-camera {
      padding: 13px 20px;
      border: 0;
      border-radius: 10px;
      background: #73f5ff;
      color: #001018;
      cursor: pointer;
      font-size: 16px;
      font-weight: 700;
    }

    #allow-camera:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>
  <video id="video" autoplay muted playsinline></video>
  <canvas id="canvas"></canvas>

  <div id="hud">
    <div class="hud-item" id="score">Score: 0</div>
    <div class="hud-item" id="health">Health: 3</div>
    <div class="hud-item" id="status">Camera required</div>
  </div>

  <section id="permission-panel">
    <div id="permission-card">
      <h1>Laser Dodge</h1>

      <p id="permission-message">
        Allow camera access. The game begins as soon as a person is visible.
      </p>

      <button id="allow-camera" type="button">
        Allow Camera
      </button>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core@4.22.0/dist/tf-core.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl@4.22.0/dist/tf-backend-webgl.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter@4.22.0/dist/tf-converter.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/body-segmentation@1.0.2/dist/body-segmentation.min.js"></script>

  <script>
    (() => {
      const video = document.getElementById("video");
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");

      const scoreElement = document.getElementById("score");
      const healthElement = document.getElementById("health");
      const statusElement = document.getElementById("status");

      const permissionPanel =
        document.getElementById("permission-panel");

      const permissionMessage =
        document.getElementById("permission-message");

      const allowCameraButton =
        document.getElementById("allow-camera");

      /*
        Offscreen canvas used for the visual green foreground mask.
      */
      const maskCanvas = document.createElement("canvas");
      const maskCtx = maskCanvas.getContext(
        "2d",
        { willReadFrequently: true }
      );

      let stream = null;
      let segmenter = null;

      let segmenting = false;
      let lastSegmentationAt = 0;

      let gameRunning = false;
      let playerVisible = false;
      let lastPlayerSeenAt = 0;

      let score = 0;
      let health = 3;

      let laser = null;
      let lastLaserTime = 0;

      /*
        Keep this interval modest. Increasing it to 125 makes slower
        phones work more easily; reducing it to 60 makes the mask update
        more often on faster devices.
      */
      const segmentationEveryMs = 100;

      /*
        The binary mask has a fully opaque green foreground. Count at
        least this many person pixels to consider the player visible.

        This deliberately stays low: it is only protecting against
        an empty mask, not imposing a body-size requirement.
      */
      const minimumPersonPixels = 120;

      /*
        Keep the last mask active for this long following a segmentation
        miss. It prevents small temporary detection flicker.
      */
      const playerGraceMs = 1000;

      /*
        Mask data used for collision.
        `1` means person, `0` means background.
      */
      const playerMask = {
        pixels: null,
        width: 0,
        height: 0
      };

      function resizeCanvas() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);

        canvas.width = Math.floor(window.innerWidth * dpr);
        canvas.height = Math.floor(window.innerHeight * dpr);

        canvas.style.width = `${window.innerWidth}px`;
        canvas.style.height = `${window.innerHeight}px`;

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function clearMask() {
        playerMask.pixels = null;
        playerMask.width = 0;
        playerMask.height = 0;

        maskCanvas.width = 1;
        maskCanvas.height = 1;

        playerVisible = false;
      }

      function resetGame() {
        score = 0;
        health = 3;
        laser = null;
        lastLaserTime = performance.now();

        playerVisible = false;
        lastPlayerSeenAt = 0;

        clearMask();
        updateHud();
      }

      function updateHud() {
        scoreElement.textContent = `Score: ${score}`;
        healthElement.textContent = `Health: ${health}`;

        if (!segmenter) {
          statusElement.textContent =
            "Loading person detection…";
          return;
        }

        if (!playerVisible) {
          statusElement.textContent =
            "Step into view — lasers are off.";
          return;
        }

        statusElement.textContent =
          "Person detected — dodge the laser.";
      }

      function showError(error) {
        console.error(error);

        allowCameraButton.disabled = false;
        allowCameraButton.textContent = "Try Camera Again";

        if (!window.isSecureContext) {
          permissionMessage.textContent =
            "Camera access requires HTTPS. Open the GitHub Pages website, not a local file.";
        } else if (error?.name === "NotAllowedError") {
          permissionMessage.textContent =
            "Camera permission was denied. Allow it in your browser site settings, then try again.";
        } else if (error?.name === "NotFoundError") {
          permissionMessage.textContent =
            "No camera was found.";
        } else if (error?.name === "NotReadableError") {
          permissionMessage.textContent =
            "Another app or tab is already using the camera.";
        } else {
          permissionMessage.textContent =
            `Camera error: ${error?.message || "Unknown error"}`;
        }

        statusElement.textContent = "Camera unavailable.";
      }

      async function allowCamera() {
        try {
          allowCameraButton.disabled = true;
          allowCameraButton.textContent = "Requesting Camera…";

          /*
            Camera request stays directly inside a real click handler.
          */
          stream = await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: false
          });

          video.srcObject = stream;
          await video.play();

          permissionPanel.classList.add("hidden");

          resetGame();

          statusElement.textContent =
            "Loading TensorFlow person detection…";

          gameRunning = true;
          requestAnimationFrame(loop);

          await loadSegmenter();

        } catch (error) {
          showError(error);
        }
      }

      async function loadSegmenter() {
        if (segmenter) {
          return;
        }

        if (!window.tf || !window.bodySegmentation) {
          throw new Error(
            "TensorFlow.js did not load. Check your connection and reload."
          );
        }

        await tf.setBackend("webgl");
        await tf.ready();

        segmenter = await bodySegmentation.createSegmenter(
          bodySegmentation.SupportedModels
            .MediaPipeSelfieSegmentation,
          {
            runtime: "tfjs",
            modelType: "general"
          }
        );

        updateHud();
      }

      /*
        Convert ImageData produced by bodySegmentation.toBinaryMask()
        into:
        - a screen-mirrored collision mask
        - a translucent green visual silhouette

        Foreground pixels are green and opaque; background pixels are
        transparent. We only check alpha here.
      */
      function storeBinaryMask(binaryMaskImageData) {
        const width = binaryMaskImageData.width;
        const height = binaryMaskImageData.height;
        const source = binaryMaskImageData.data;

        const pixels = new Uint8Array(width * height);
        const visual = new Uint8ClampedArray(width * height * 4);

        let personPixelCount = 0;

        for (let y = 0; y < height; y += 1) {
          for (let x = 0; x < width; x += 1) {
            const sourceIndex = y * width + x;
            const sourceRgbaIndex = sourceIndex * 4;

            const alpha = source[sourceRgbaIndex + 3];

            /*
              toBinaryMask writes transparent background and opaque
              foreground. Alpha above 0 therefore means person.
            */
            if (alpha === 0) {
              continue;
            }

            /*
              Mirror mask X to align with CSS-mirrored video.
            */
            const mirroredX = width - 1 - x;
            const targetIndex = y * width + mirroredX;
            const targetRgbaIndex = targetIndex * 4;

            pixels[targetIndex] = 1;

            visual[targetRgbaIndex] = 72;
            visual[targetRgbaIndex + 1] = 255;
            visual[targetRgbaIndex + 2] = 180;
            visual[targetRgbaIndex + 3] = 130;

            personPixelCount += 1;
          }
        }

        if (personPixelCount < minimumPersonPixels) {
          return false;
        }

        maskCanvas.width = width;
        maskCanvas.height = height;

        maskCtx.putImageData(
          new ImageData(visual, width, height),
          0,
          0
        );

        playerMask.pixels = pixels;
        playerMask.width = width;
        playerMask.height = height;

        return true;
      }

      async function updatePersonMask(timestamp) {
        if (
          !segmenter ||
          segmenting ||
          video.readyState <
            HTMLMediaElement.HAVE_CURRENT_DATA
        ) {
          return;
        }

        if (
          timestamp - lastSegmentationAt <
          segmentationEveryMs
        ) {
          return;
        }

        segmenting = true;
        lastSegmentationAt = timestamp;

        try {
          /*
            Ask TensorFlow for a person/background segmentation.
          */
          const people = await segmenter.segmentPeople(
            video,
            {
              flipHorizontal: false,
              multiSegmentation: false,
              segmentBodyParts: false
            }
          );

          /*
            Convert the segmentation list through the official utility.
            Foreground is opaque green; background is transparent.
          */
          const binaryMask =
            await bodySegmentation.toBinaryMask(
              people,
              {
                r: 72,
                g: 255,
                b: 180,
                a: 255
              },
              {
                r: 0,
                g: 0,
                b: 0,
                a: 0
              },
              false,
              0.5
            );

          const detected = storeBinaryMask(binaryMask);

          if (detected) {
            playerVisible = true;
            lastPlayerSeenAt = timestamp;
          } else if (
            timestamp - lastPlayerSeenAt >
            playerGraceMs
          ) {
            clearMask();
          }

        } catch (error) {
          console.warn("Segmentation frame failed:", error);

        } finally {
          segmenting = false;
        }
      }

      function spawnLaser(timestamp) {
        if (!playerVisible) {
          return;
        }

        const horizontal = Math.random() > 0.5;

        laser = {
          horizontal,
          position: horizontal
            ? 70 +
              Math.random() *
              Math.max(80, window.innerHeight - 140)
            : 70 +
              Math.random() *
              Math.max(80, window.innerWidth - 140),
          createdAt: timestamp,
          warningMs: 900,
          activeMs: 850,
          active: false,
          hit: false,
          thickness: 20
        };
      }

      function updateLaser(timestamp) {
        /*
          No segmentation mask means no laser damage.
        */
        if (!playerVisible) {
          return;
        }

        if (!laser) {
          if (timestamp - lastLaserTime > 1150) {
            spawnLaser(timestamp);
          }

          return;
        }

        const elapsed = timestamp - laser.createdAt;

        if (!laser.active && elapsed >= laser.warningMs) {
          laser.active = true;
        }

        if (
          laser.active &&
          !laser.hit &&
          laserHitsPerson(laser)
        ) {
          laser.hit = true;
          health -= 1;

          if (health <= 0) {
            gameRunning = false;
            statusElement.textContent =
              `Game over — final score: ${score}. Refresh to play again.`;
          }
        }

        if (elapsed >= laser.warningMs + laser.activeMs) {
          if (!laser.hit) {
            score += 1;
          }

          laser = null;
          lastLaserTime = timestamp;
        }
      }

      function maskHasPersonAt(screenX, screenY) {
        if (
          !playerMask.pixels ||
          playerMask.width === 0 ||
          playerMask.height === 0
        ) {
          return false;
        }

        const x = Math.floor(
          (screenX / window.innerWidth) *
          playerMask.width
        );

        const y = Math.floor(
          (screenY / window.innerHeight) *
          playerMask.height
        );

        if (
          x < 0 ||
          x >= playerMask.width ||
          y < 0 ||
          y >= playerMask.height
        ) {
          return false;
        }

        return (
          playerMask.pixels[
            y * playerMask.width + x
          ] === 1
        );
      }

      function laserHitsPerson(currentLaser) {
        const step = 8;
        const halfThickness =
          currentLaser.thickness / 2;

        if (currentLaser.horizontal) {
          for (
            let x = 0;
            x < window.innerWidth;
            x += step
          ) {
            for (
              let offset = -halfThickness;
              offset <= halfThickness;
              offset += 7
            ) {
              if (
                maskHasPersonAt(
                  x,
                  currentLaser.position + offset
                )
              ) {
                return true;
              }
            }
          }

          return false;
        }

        for (
          let y = 0;
          y < window.innerHeight;
          y += step
        ) {
          for (
            let offset = -halfThickness;
            offset <= halfThickness;
            offset += 7
          ) {
            if (
              maskHasPersonAt(
                currentLaser.position + offset,
                y
              )
            ) {
              return true;
            }
          }
        }

        return false;
      }

      function drawMask() {
        if (
          !playerVisible ||
          !playerMask.pixels
        ) {
          return;
        }

        ctx.save();

        ctx.globalAlpha = 0.76;
        ctx.imageSmoothingEnabled = true;

        ctx.drawImage(
          maskCanvas,
          0,
          0,
          playerMask.width,
          playerMask.height,
          0,
          0,
          window.innerWidth,
          window.innerHeight
        );

        ctx.restore();
      }

      function drawLaser() {
        if (!laser) {
          return;
        }

        const elapsed = performance.now() - laser.createdAt;
        const warning = !laser.active;

        ctx.save();

        if (warning) {
          const opacity =
            0.30 +
            0.40 *
            Math.min(1, elapsed / laser.warningMs);

          ctx.strokeStyle =
            `rgba(255, 92, 92, ${opacity})`;

          ctx.lineWidth = 3;
          ctx.setLineDash([10, 9]);

        } else {
          ctx.strokeStyle = "#ff1633";
          ctx.lineWidth = laser.thickness + 16;
          ctx.shadowColor = "#ff1633";
          ctx.shadowBlur = 26;
        }

        ctx.beginPath();

        if (laser.horizontal) {
          ctx.moveTo(0, laser.position);
          ctx.lineTo(window.innerWidth, laser.position);
        } else {
          ctx.moveTo(laser.position, 0);
          ctx.lineTo(laser.position, window.innerHeight);
        }

        ctx.stroke();

        ctx.setLineDash([]);
        ctx.shadowBlur = 0;

        if (!warning) {
          ctx.strokeStyle = "#fff4f4";
          ctx.lineWidth = 3;

          ctx.beginPath();

          if (laser.horizontal) {
            ctx.moveTo(0, laser.position);
            ctx.lineTo(window.innerWidth, laser.position);
          } else {
            ctx.moveTo(laser.position, 0);
            ctx.lineTo(laser.position, window.innerHeight);
          }

          ctx.stroke();
        }

        ctx.restore();
      }

      function drawWaitingMessage() {
        if (playerVisible) {
          return;
        }

        ctx.save();

        ctx.fillStyle = "rgba(0, 0, 0, 0.48)";
        ctx.fillRect(
          0,
          window.innerHeight - 70,
          window.innerWidth,
          70
        );

        ctx.fillStyle = "#ffe66d";
        ctx.font = "bold 16px Arial";
        ctx.textAlign = "center";

        ctx.fillText(
          segmenter
            ? "STEP INTO VIEW — LASERS ARE OFF"
            : "LOADING PERSON DETECTION…",
          window.innerWidth / 2,
          window.innerHeight - 30
        );

        ctx.restore();
      }

      function drawGameOver() {
        if (health > 0) {
          return;
        }

        ctx.save();

        ctx.fillStyle = "rgba(0, 0, 0, 0.70)";
        ctx.fillRect(
          0,
          0,
          window.innerWidth,
          window.innerHeight
        );

        ctx.fillStyle = "#ff6875";
        ctx.font = "bold 34px Arial";
        ctx.textAlign = "center";

        ctx.fillText(
          "GAME OVER",
          window.innerWidth / 2,
          window.innerHeight / 2 - 18
        );

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 18px Arial";

        ctx.fillText(
          `Final score: ${score}`,
          window.innerWidth / 2,
          window.innerHeight / 2 + 18
        );

        ctx.font = "15px Arial";

        ctx.fillText(
          "Refresh to play again",
          window.innerWidth / 2,
          window.innerHeight / 2 + 50
        );

        ctx.restore();
      }

      function draw() {
        ctx.clearRect(
          0,
          0,
          window.innerWidth,
          window.innerHeight
        );

        drawMask();
        drawLaser();
        drawWaitingMessage();
        drawGameOver();
      }

      function loop(timestamp) {
        if (!gameRunning) {
          draw();
          updateHud();
          return;
        }

        updatePersonMask(timestamp);
        updateLaser(timestamp);

        draw();
        updateHud();

        requestAnimationFrame(loop);
      }

      allowCameraButton.addEventListener(
        "click",
        allowCamera
      );

      window.addEventListener(
        "resize",
        resizeCanvas
      );

      window.addEventListener(
        "pagehide",
        () => {
          if (stream) {
            stream.getTracks().forEach(
              (track) => track.stop()
            );
          }

          if (
            segmenter &&
            typeof segmenter.dispose === "function"
          ) {
            segmenter.dispose();
          }
        }
      );

      resizeCanvas();
      updateHud();
    })();
  </script>
</body>
</html>
