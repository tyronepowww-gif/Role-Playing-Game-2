<!DOCTYPE html>
<html>
<body style="margin:0;background:#111;">
  <button
    id="start"
    style="
      position:fixed;
      z-index:2;
      top:20px;
      left:20px;
      padding:15px;
      font-size:18px;
    "
  >
    Start Camera
  </button>

  <video
    id="video"
    autoplay
    playsinline
    muted
    style="
      width:100vw;
      height:100vh;
      object-fit:cover;
    "
  ></video>

  <script>
    const button =
    document.getElementById("start");

    const video =
    document.getElementById("video");

    button.onclick =
    async function(){

      try{

        const stream =
        await navigator.mediaDevices.getUserMedia({
          video:true,
          audio:false
        });

        video.srcObject=stream;

        await video.play();

        button.textContent=
        "Camera Working";

      }catch(error){

        button.textContent=
        "Camera Failed";

        console.error(error);

      }
    };
  </script>
</body>
</html>
