<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Storm Runner</title>

<style>
html,body{
margin:0;
overflow:hidden;
background:#020814;
font-family:Arial,sans-serif;
}

canvas{
display:block;
}

#hud{
position:fixed;
top:10px;
left:10px;
color:white;
background:rgba(0,0,0,.5);
padding:12px;
border-radius:12px;
line-height:1.5;
font-weight:bold;
}

#message{
position:fixed;
bottom:30px;
left:50%;
transform:translateX(-50%);
color:#7efcff;
font-size:24px;
font-weight:bold;
text-shadow:0 0 15px cyan;
}

#gameover{
position:fixed;
inset:0;
display:none;
align-items:center;
justify-content:center;
flex-direction:column;
background:rgba(0,0,0,.8);
color:white;
}

button{
padding:15px 25px;
font-size:20px;
cursor:pointer;
}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud">
<div>AURA: <span id="aura">100</span>%</div>
<div>COMBO: <span id="combo">0</span></div>
<div>SPD: <span id="spd">0</span></div>
<div>PL: <span id="pl">0</span></div>
</div>

<div id="message"></div>

<div id="gameover">
<h1>STORM REPORT</h1>
<h2 id="report"></h2>
<button onclick="restart()">RESTART</button>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

function resize(){
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
}

resize();
window.addEventListener("resize",resize);

const auraText=document.getElementById("aura");
const comboText=document.getElementById("combo");
const spdText=document.getElementById("spd");
const plText=document.getElementById("pl");
const msg=document.getElementById("message");
const gameover=document.getElementById("gameover");
const report=document.getElementById("report");

let player={
x:window.innerWidth/2,
y:window.innerHeight/2
};

let aura=100;
let combo=0;
let bestCombo=0;

let SPD=0;
let CTRL=0;
let TAC=0;
let EVA=0;

let gameRunning=true;

const threat={
active:false,
mode:"LEFT",
x:0,
y:0,
speed:10,
telegraph:1000,
spawn:0
};

function randomMode(){

const pool=[
"LEFT",
"RIGHT",
"DUCK"
];

threat.mode=
pool[Math.floor(Math.random()*pool.length)];

threat.active=true;

threat.x=canvas.width+100;

threat.y=
100+
Math.random()*
(canvas.height-200);

threat.spawn=
performance.now();
}

function showMessage(text){
msg.textContent=text;
}

function fail(){

combo=0;

aura-=20;

if(aura<=0){

gameRunning=false;

const combatPL=Math.round(
SPD*.25+
CTRL*.20+
TAC*.25+
EVA*.30
);

report.innerHTML=
`
Combat PL: ${combatPL}<br>
Best Combo: ${bestCombo}
`;

gameover.style.display="flex";
}
}

function success(reaction){

combo++;

bestCombo=
Math.max(bestCombo,combo);

SPD=
Math.round(
1000-Math.min(reaction,1000)
);

CTRL=
70+Math.random()*30;

TAC=
70+Math.random()*30;

EVA=
Math.min(100,EVA+2);

randomMode();
}

function drawPlayer(){

ctx.strokeStyle="#59ffe0";
ctx.lineWidth=4;

ctx.beginPath();
ctx.arc(
player.x,
player.y,
40,
0,
Math.PI*2
);

ctx.stroke();

ctx.fillStyle="cyan";

ctx.beginPath();

ctx.arc(
player.x,
player.y,
10,
0,
Math.PI*2
);

ctx.fill();
}

function drawThreat(){

if(!threat.active)return;

const telegraphElapsed=
performance.now()-threat.spawn;

if(telegraphElapsed<threat.telegraph){

ctx.strokeStyle="yellow";

ctx.lineWidth=4;

ctx.setLineDash([10,10]);

ctx.beginPath();

ctx.moveTo(
threat.x,
threat.y
);

ctx.lineTo(
player.x,
player.y
);

ctx.stroke();

ctx.setLineDash([]);

showMessage(
"DODGE " + threat.mode
);

return;
}

ctx.fillStyle="#ff5151";

ctx.beginPath();

ctx.arc(
threat.x,
threat.y,
25,
0,
Math.PI*2
);

ctx.fill();

threat.x-=threat.speed;

const dist=Math.hypot(
player.x-threat.x,
player.y-threat.y
);

if(dist<60){

fail();

randomMode();
}

if(threat.x<-100){

success(
performance.now()-threat.spawn
);

}
}

function drawAura(){

const radius=
60+
Math.sin(
performance.now()/100
)*5;

ctx.strokeStyle=
`rgba(0,255,255,${
aura/100
})`;

ctx.lineWidth=3;

ctx.beginPath();

ctx.arc(
player.x,
player.y,
radius,
0,
Math.PI*2
);

ctx.stroke();
}

function updateHud(){

auraText.textContent=aura;
comboText.textContent=combo;
spdText.textContent=SPD;

const pl=Math.round(
SPD*.25+
CTRL*.20+
TAC*.25+
EVA*.30
);

plText.textContent=pl;
}

function loop(){

if(gameRunning){

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);

drawAura();

drawPlayer();

drawThreat();

updateHud();
}

requestAnimationFrame(loop);
}

function restart(){

aura=100;
combo=0;
bestCombo=0;

SPD=0;
CTRL=0;
TAC=0;
EVA=0;

gameRunning=true;

gameover.style.display="none";

randomMode();
}

window.addEventListener(
"mousemove",
e=>{
player.x=e.clientX;
player.y=e.clientY;
}
);

window.addEventListener(
"touchmove",
e=>{
player.x=e.touches[0].clientX;
player.y=e.touches[0].clientY;
},
{passive:true}
);

randomMode();
loop();
</script>

</body>
</html>
