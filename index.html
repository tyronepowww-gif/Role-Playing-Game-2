<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  />
  <title>Storm Runner — Camera Dodge Test</title>

  <style>
    :root {
      color-scheme: dark;
      font-family: Arial, Helvetica, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #06101f;
    }

    #video,
    #canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
    }

    #video {
      z-index: 1;
      object-fit: cover;
      transform: scaleX(-1);
      background: #000;
      filter: brightness(0.7) contrast(1.05) hue-rotate(165deg);
    }

    #canvas {
      z-index: 2;
      pointer-events: none;
    }

    #hud {
      position: fixed;
      z-index: 5;
      top: 14px;
      left: 14px;
      right: 14px;
      display: none;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
      pointer-events: none;
    }

    .stat {
      padding: 9px 6px;
      border: 1px solid rgba(102, 225, 255, 0.35);
      border-radius: 10px;
      background: rgba(0, 11, 32, 0.72);
      color: #eefeff;
      text-align: center;
      text-shadow: 0 1px 8px #000;
      backdrop-filter: blur(8px);
    }

    .stat span {
      display: block;
      color: #7ceaff;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.1em;
    }

    .stat strong {
      display: block;
      margin-top: 3px;
      font-size: 16px;
    }

    #status {
      position: fixed;
      z-index: 8;
      bottom: 18px;
      left: 50%;
      width: min(calc(100vw - 32px), 640px);
      padding: 11px 14px;
      border: 1px solid rgba(105, 228, 255, 0.32);
      border-radius: 12px;
      background: rgba(0, 10, 27, 0.84);
      color: #e8ffff;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 12px;
      line-height: 1.4;
      text-align: center;
      transform: translateX(-50%);
      backdrop-filter: blur(10px);
    }

    #start-screen {
      position: fixed;
      z-index: 10;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(0, 5, 17, 0.6);
    }

    #panel {
      width: min(100%, 420px);
      padding: 25px;
      border: 1px solid rgba(103, 228, 255, 0.34);
      border-radius: 18px;
      background: linear-gradient(
        145deg,
        rgba(16, 53, 96, 0.97),
        rgba(3, 10, 29, 0.97)
      );
      box-shadow: 0 20px 70px rgba(0, 0, 0, 0.7);
      text-align: center;
    }

    #panel p {
      color: #c1d7ec;
      font-size: 14px;
      line-height: 1.5;
    }

    #panel h1 {
      margin: 8px 0;
      color: white;
      font-size: 38px;
    }

    #start-button {
      width: 100%;
      margin-top: 9px;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: linear-gradient(135deg, #4eeedc, #5da8ff);
      color: #041120;
      cursor: pointer;
      font-size: 15px;
      font-weight: 900;
    }

    #start-button:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>
  <video id="video" autoplay muted playsinline></video>
  <canvas id="canvas"></canvas>

  <section id="hud">
    <div class="stat">
      <span>AURA</span>
      <strong id="aura">100%</strong>
    </div>

    <div class="stat">
      <span>TIME</span>
      <strong id="time">0.0s</strong>
    </div>

    <div class="stat">
      <span>DODGES</span>
      <strong id="dodges">0</strong>
    </div>

    <div class="stat">
      <span>TRACK</span>
      <strong id="track">0%</strong>
    </div>
  </section>

  <div id="status">Ready. Click Start Camera.</div>

  <section id="start-screen">
    <div id="panel">
      <p>CAMERA DODGE GAME — DIAGNOSTIC BUILD</p>
      <h1>Storm Runner</h1>
      <p>
        This version checks camera permission and pose-model loading first.
        Keep your head and both shoulders visible after the game begins.
      </p>
      <button id="start-button">Start Camera</button>
    </div>
  </section>

  <script type="module">
    import {
      FilesetResolver,
      PoseLandmarker
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm";

    const video = document.querySelector("#video");
    const canvas = document.querySelector("#canvas");
    const ctx = canvas.getContext("2d");

    const startButton = document.querySelector("#start-button");
    const startScreen = document.querySelector("#start-screen");
    const statusElement = document.querySelector("#status");
    const hud = document.querySelector("#hud");

    const auraElement = document.querySelector("#aura");
    const timeElement = document.querySelector("#time");
    const dodgesElement = document.querySelector("#dodges");
    const trackElement = document.querySelector("#track");

    const MP_VERSION = "0.10.22";
    const WASM_URL =
      `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VERSION}/wasm`;

    const MODEL_URL =
      "https://storage.googleapis.com/mediapipe-models/" +
      "pose_landmarker/pose_landmarker_lite/float16/1/" +
      "pose_landmarker_lite.task";

    let poseLandmarker = null;
    let started = false;
    let lastVideoTime = -1;
    let lastFrameTime = 0;
    let lastPose = null;

    const game = {
      aura: 100,
      dodges: 0,
      startedAt: 0,
      lastSpawnAt: 0,
      projectile: null
    };

    function setStatus(text) {
      statusElement.textContent = text;
      console.log("[Storm Runner]", text);
    }

    function resizeCanvas() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);

      canvas.width = Math.floor(window.innerWidth * dpr);
      canvas.height = Math.floor(window.innerHeight * dpr);

      canvas.style.width = `${window.innerWidth}px`;
      canvas.style.height = `${window.innerHeight}px`;

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function waitForEvent(element, eventName, timeoutMs = 10000) {
      return new Promise((resolve, reject) => {
        const timeout = window.setTimeout(() => {
          cleanup();
          reject(
            new Error(
              `Timed out waiting for "${eventName}".`
            )
          );
        }, timeoutMs);

        function onEvent() {
          cleanup();
          resolve();
        }

        function cleanup() {
          clearTimeout(timeout);
          element.removeEventListener(eventName, onEvent);
        }

        element.addEventListener(eventName, onEvent, { once: true });
      });
    }

    async function startCamera() {
      if (!navigator.mediaDevices?.getUserMedia) {
        throw new Error(
          "getUserMedia is unavailable. Open this through localhost or HTTPS, not file://."
        );
      }

      if (!window.isSecureContext) {
        throw new Error(
          "This page is not in a secure context. Use localhost during development or HTTPS after deployment."
        );
      }

      setStatus("Requesting front-camera permission…");

      const stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: {
          facingMode: { ideal: "user" },
          width: { ideal: 1280 },
          height: { ideal: 720 }
        }
      });

      video.srcObject = stream;

      if (video.readyState < 1) {
        await waitForEvent(video, "loadedmetadata");
      }

      await video.play();

      setStatus(
        `Camera online: ${video.videoWidth} × ${video.videoHeight}`
      );
    }

    async function loadPoseModel() {
      setStatus("Loading MediaPipe vision runtime…");

      const vision = await FilesetResolver.forVisionTasks(WASM_URL);

      setStatus("Loading pose landmark model…");

      poseLandmarker =
        await PoseLandmarker.createFromOptions(vision, {
          baseOptions: {
            modelAssetPath: MODEL_URL,
            delegate: "GPU"
          },
          runningMode: "VIDEO",
          numPoses: 1,
          minPoseDetectionConfidence: 0.5,
          minPosePresenceConfidence: 0.5,
          minTrackingConfidence: 0.5
        });

      setStatus("Pose model loaded.");
    }

    function getPose(timestamp) {
      if (
        !poseLandmarker ||
        video.readyState < HTMLMediaElement.HAVE_CURRENT_DATA
      ) {
        return null;
      }

      if (video.currentTime === lastVideoTime) {
        return lastPose;
      }

      lastVideoTime = video.currentTime;

      const result = poseLandmarker.detectForVideo(
        video,
        timestamp
      );

      if (!result.landmarks?.length) {
        lastPose = null;
        return null;
      }

      const landmarks = result.landmarks[0];

      const nose = landmarks[0];
      const leftShoulder = landmarks[11];
      const rightShoulder = landmarks[12];

      if (!nose || !leftShoulder || !rightShoulder) {
        lastPose = null;
        return null;
      }

      const confidence =
        ((nose.visibility ?? 1) +
          (leftShoulder.visibility ?? 1) +
          (rightShoulder.visibility ?? 1)) / 3;

      if (confidence < 0.35) {
        lastPose = null;
        return null;
      }

      const shoulderWidth = Math.hypot(
        rightShoulder.x - leftShoulder.x,
        rightShoulder.y - leftShoulder.y
      );

      lastPose = {
        nose,
        shoulderWidth,
        confidence
      };

      return lastPose;
    }

    function makePlayer(pose) {
      if (!pose) return null;

      const shoulderPixels =
        pose.shoulderWidth * window.innerWidth;

      return {
        x: (1 - pose.nose.x) * window.innerWidth,
        y: pose.nose.y * window.innerHeight,
        radiusX: Math.max(28, shoulderPixels * 0.28),
        radiusY: Math.max(35, shoulderPixels * 0.35),
        confidence: pose.confidence
      };
    }

    function spawnProjectile(player, timestamp) {
      const fromLeft = Math.random() > 0.5;

      const start = {
        x: fromLeft ? -60 : window.innerWidth + 60,
        y: 120 + Math.random() * (window.innerHeight - 260)
      };

      const target = {
        x: player.x,
        y: player.y
      };

      const dx = target.x - start.x;
      const dy = target.y - start.y;
      const length = Math.hypot(dx, dy) || 1;
      const speed = 580;

      game.projectile = {
        x: start.x,
        y: start.y,
        vx: (dx / length) * speed,
        vy: (dy / length) * speed,
        targetX: target.x,
        targetY: target.y,
        radius: 14,
        createdAt: timestamp,
        telegraphMs: 750,
        fired: false
      };

      setStatus("LOCK ON — move when the wind blade fires.");
    }

    function circleHitsEllipse(circle, ellipse) {
      const rx = ellipse.radiusX + circle.radius;
      const ry = ellipse.radiusY + circle.radius;

      const dx = circle.x - ellipse.x;
      const dy = circle.y - ellipse.y;

      return (
        (dx * dx) / (rx * rx) +
          (dy * dy) / (ry * ry) <= 1
      );
    }

    function drawPlayer(player) {
      if (!player) return;

      ctx.save();
      ctx.strokeStyle = "rgba(87, 255, 190, 0.95)";
      ctx.fillStyle = "rgba(87, 255, 190, 0.12)";
      ctx.lineWidth = 2;

      ctx.beginPath();
      ctx.ellipse(
        player.x,
        player.y,
        player.radiusX,
        player.radiusY,
        0,
        0,
        Math.PI * 2
      );

      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = "#d8fff0";
      ctx.font = "bold 12px Arial";
      ctx.textAlign = "center";
      ctx.fillText(
        "HEAD HITBOX",
        player.x,
        player.y - player.radiusY - 12
      );

      ctx.restore();
    }

    function drawProjectile(projectile, timestamp) {
      if (!projectile) return;

      ctx.save();

      if (!projectile.fired) {
        const pulse = 0.35 + Math.sin(timestamp / 110) * 0.2;

        ctx.globalAlpha = pulse;
        ctx.strokeStyle = "#fff0a0";
        ctx.lineWidth = 2;
        ctx.setLineDash([8, 8]);

        ctx.beginPath();
        ctx.moveTo(projectile.x, projectile.y);
        ctx.lineTo(projectile.targetX, projectile.targetY);
        ctx.stroke();

        ctx.setLineDash([]);
        ctx.beginPath();
        ctx.arc(
          projectile.targetX,
          projectile.targetY,
          25,
          0,
          Math.PI * 2
        );
        ctx.stroke();

        ctx.restore();
        return;
      }

      const direction = Math.atan2(
        projectile.vy,
        projectile.vx
      );

      const tailLength = 70;
      const tailX =
        projectile.x - Math.cos(direction) * tailLength;
      const tailY =
        projectile.y - Math.sin(direction) * tailLength;

      const gradient = ctx.createLinearGradient(
        tailX,
        tailY,
        projectile.x,
        projectile.y
      );

      gradient.addColorStop(
        0,
        "rgba(55, 225, 255, 0)"
      );

      gradient.addColorStop(
        1,
        "rgba(83, 235, 255, 0.98)"
      );

      ctx.strokeStyle = gradient;
      ctx.lineWidth = 18;
      ctx.lineCap = "round";

      ctx.beginPath();
      ctx.moveTo(tailX, tailY);
      ctx.lineTo(projectile.x, projectile.y);
      ctx.stroke();

      const glow = ctx.createRadialGradient(
        projectile.x,
        projectile.y,
        1,
        projectile.x,
        projectile.y,
        38
      );

      glow.addColorStop(0, "#ffffff");
      glow.addColorStop(0.35, "#caffff");
      glow.addColorStop(0.68, "#3de2ff");
      glow.addColorStop(1, "rgba(39, 175, 255, 0)");

      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(
        projectile.x,
        projectile.y,
        38,
        0,
        Math.PI * 2
      );
      ctx.fill();

      ctx.restore();
    }

    function updateProjectile(player, deltaMs, timestamp) {
      const projectile = game.projectile;

      if (!projectile || !player) return;

      if (!projectile.fired) {
        if (
          timestamp - projectile.createdAt >=
          projectile.telegraphMs
        ) {
          projectile.fired = true;
          setStatus("FIRE!");
        }

        return;
      }

      const dt = deltaMs / 1000;

      projectile.x += projectile.vx * dt;
      projectile.y += projectile.vy * dt;

      if (circleHitsEllipse(projectile, player)) {
        game.aura = Math.max(0, game.aura - 25);
        game.projectile = null;

        setStatus(`HIT — Aura ${game.aura}%`);

        if (game.aura <= 0) {
          started = false;
          hud.style.display = "none";
          startScreen.classList.remove("hidden");
          startButton.disabled = false;
          startButton.textContent = "Restart Run";
          setStatus("Run ended. Click Restart Run.");
        }

        return;
      }

      const margin = 120;

      if (
        projectile.x < -margin ||
        projectile.x > window.innerWidth + margin ||
        projectile.y < -margin ||
        projectile.y > window.innerHeight + margin
      ) {
        game.dodges += 1;
        game.projectile = null;
        setStatus(`CLEAN DODGE — ${game.dodges} total`);
      }
    }

    function updateHud(player) {
      auraElement.textContent = `${game.aura}%`;

      const elapsed =
        (performance.now() - game.startedAt) / 1000;

      timeElement.textContent = `${elapsed.toFixed(1)}s`;
      dodgesElement.textContent = game.dodges;
      trackElement.textContent = player
        ? `${Math.round(player.confidence * 100)}%`
        : "0%";
    }

    function gameLoop(timestamp) {
      if (!started) return;

      const deltaMs = Math.min(
        timestamp - lastFrameTime || 16,
        50
      );

      lastFrameTime = timestamp;

      const pose = getPose(timestamp);
      const player = makePlayer(pose);

      ctx.clearRect(
        0,
        0,
        window.innerWidth,
        window.innerHeight
      );

      if (!player) {
        setStatus(
          "No pose lock. Step back and show your head plus both shoulders."
        );
      } else {
        if (!game.projectile) {
          const waitMs = 900;

          if (timestamp - game.lastSpawnAt > waitMs) {
            spawnProjectile(player, timestamp);
            game.lastSpawnAt = timestamp;
          }
        }

        updateProjectile(player, deltaMs, timestamp);
        drawPlayer(player);
      }

      drawProjectile(game.projectile, timestamp);
      updateHud(player);

      requestAnimationFrame(gameLoop);
    }

    async function startGame() {
      startButton.disabled = true;
      startButton.textContent = "Starting…";

      try {
        if (!window.isSecureContext) {
          throw new Error(
            "Not secure: use http://localhost or an HTTPS website. Do not open index.html with file://."
          );
        }

        resizeCanvas();

        setStatus("Starting camera…");
        await startCamera();

        setStatus("Loading pose model…");
        await loadPoseModel();

        game.aura = 100;
        game.dodges = 0;
        game.projectile = null;
        game.startedAt = performance.now();
        game.lastSpawnAt = performance.now();

        started = true;
        lastFrameTime = performance.now();

        startScreen.classList.add("hidden");
        hud.style.display = "grid";

        setStatus(
          "Camera and pose model ready. Stand where head and shoulders are visible."
        );

        requestAnimationFrame(gameLoop);
      } catch (error) {
        console.error(error);

        const message =
          error?.name === "NotAllowedError"
            ? "Camera permission was denied. Open browser settings, allow camera access, then retry."
            : error?.name === "NotFoundError"
              ? "No camera was found. Connect or enable a camera, then retry."
              : error?.message ||
                "Startup failed. Check the browser console for details.";

        setStatus(`ERROR: ${message}`);

        startButton.disabled = false;
        startButton.textContent = "Try Start Camera Again";
      }
    }

    startButton.addEventListener("click", startGame);

    window.addEventListener("resize", resizeCanvas);

    window.addEventListener("beforeunload", () => {
      const stream = video.srcObject;

      if (stream) {
        stream.getTracks().forEach((track) => track.stop());
      }
    });

    resizeCanvas();

    if (!window.isSecureContext) {
      setStatus(
        "WARNING: This page is not secure. Run it on localhost or HTTPS; file:// will not access the camera."
      );
    }
  </script>
</body>
</html>
